<style>
:root{--bg:#0f1115;--card:#181b20;--blue:#0088ff;--cyan:#00d2ff;--line:#2a2e37;--text:#e1e6ed;--dim:#8a94a6}
@media (prefers-color-scheme:light){:root{--bg:#f1f4f9;--card:#fff;--line:#d5dbe5;--text:#1b2230;--dim:#5b667a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:12px;padding:32px 26px;text-align:center}
.card img{width:72px;height:72px;border-radius:50%;border:2px solid var(--cyan);object-fit:cover}
h1{margin:14px 0 4px;font-size:1.5rem;letter-spacing:2px}
.sub{color:var(--cyan);font-size:.75rem;letter-spacing:2px;margin-bottom:18px}
p{color:var(--dim);line-height:1.7;font-size:.9rem;margin:0 0 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:8px;font-weight:bold;font-size:.95rem;text-decoration:none;color:#fff;background:#5865f2;transition:.2s}
.btn:hover{background:#4752c4}
.btn.sec{background:none;border:1px solid var(--line);color:var(--text);margin-top:10px}
.btn.sec:hover{border-color:var(--blue)}
.err{display:none;margin-bottom:18px;padding:10px 12px;border-radius:8px;font-size:.85rem;line-height:1.6;color:#ffb4a8;background:rgba(255,80,60,.12);border:1px solid rgba(255,80,60,.4)}
.note{margin-top:18px;font-size:.72rem;color:var(--dim)}
