<style>
:root{color-scheme:dark;--text:#e6ebf2;--dim:#8f9bb0;--line:#1c2430;--blue:#0088ff;--cyan:#00d2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 20px;background:#05070a;color:var(--text);font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  background-image:radial-gradient(55% 45% at 50% 30%,rgba(0,170,255,.2),transparent 70%),radial-gradient(70% 40% at 50% 110%,rgba(0,136,255,.12),transparent 70%)}
.gate{width:100%;max-width:360px;text-align:center}
.mark{position:relative;width:176px;height:176px;margin:0 auto 26px}
.mark img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);border-radius:50%;object-fit:cover;box-shadow:0 0 56px rgba(0,210,255,.45);animation:fade .8s ease both}
.mark svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mark circle{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-dasharray:515;stroke-dashoffset:515;animation:draw 1.6s .2s cubic-bezier(.6,0,.2,1) forwards}
.mark .base{stroke:rgba(0,210,255,.16);stroke-dashoffset:0;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:12px;margin:0 0 10px;color:var(--cyan);font-size:.8rem;font-weight:700;letter-spacing:.22em}
.kicker::before,.kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(0,210,255,.55))}
.kicker::after{transform:scaleX(-1)}
h1{margin:0 0 6px;font-family:Orbitron,'Segoe UI',sans-serif;font-weight:800;font-size:2.35rem;letter-spacing:.2em;padding-left:.2em;color:#fff;text-shadow:0 0 22px rgba(0,210,255,.5)}
.sub{margin:0 0 30px;font-size:1.02rem;font-weight:900;letter-spacing:.3em;padding-left:.3em;color:var(--dim)}
.err{display:none;margin:0 0 16px;padding:11px 14px;border-radius:6px;border:1px solid rgba(255,92,74,.45);background:rgba(255,92,74,.1);font-size:.85rem;line-height:1.7;color:#ffc2ba;text-align:left}
