<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>獺祭 AI コンソール ｜Blue Gang</title>
<style>
:root{--bg:#060b12;--panel:#0a1420;--panel2:#0e1c2c;--border:#15324a;--cyan:#00c8ff;--text:#d7e6f2;--muted:#6f8aa0;--green:#4ade80;--red:#ff6b6b;--yellow:#facc15;--code:#050c15;
--mono:"Cascadia Code",Consolas,Menlo,"Noto Sans Mono CJK JP",monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--text);background:var(--code);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
.btn{background:linear-gradient(135deg,#0070d8,#00b4ff);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.ghost:not(:disabled):hover{border-color:var(--cyan);color:var(--cyan)}
.btn.danger{background:#8b2a2a}
.btn.sm{padding:6px 10px;font-size:.8rem}

/* ----- gate (login) ----- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 25%,#06243a 0%,#060b12 65%)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 0 42px rgba(0,200,255,.12)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:10px;flex:none;background:linear-gradient(135deg,#0a2d4d,#0088ff);display:grid;place-items:center;font-weight:900;color:#fff}
.mark.sm{width:30px;height:30px;border-radius:8px;font-size:.9rem}
.brand h1{font-size:1.05rem;margin:0;letter-spacing:.04em}
.brand small{color:var(--cyan);font-family:var(--mono);font-size:.7rem;letter-spacing:.08em}
.card label{display:block;font-size:.8rem;color:var(--muted);margin:14px 0 6px}
.err{color:var(--red);font-size:.82rem;min-height:1.2em;margin-top:10px;word-break:break-all}
.note{font-size:.72rem;color:var(--muted);margin-top:14px;line-height:1.6}

/* ----- app ----- */
#app{height:100vh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:272px 1fr}
header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header .ttl{font-family:var(--mono);font-size:.9rem}
header .ttl b{color:var(--cyan)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.75rem;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.pill.on{color:var(--green);border-color:rgba(74,222,128,.4)}
.pill.off{color:var(--muted)}
.pill.wait{color:var(--yellow);border-color:rgba(250,204,21,.4)}
.pill.err{color:var(--red);border-color:rgba(255,107,107,.4)}

/* ----- sidebar (chat history) ----- */
aside{background:var(--panel);border-right:1px solid var(--border);min-height:0;display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.side-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.9rem}
.side-brand small{display:block;color:var(--cyan);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;font-weight:400}
.side-new{padding:0 14px 10px}
.side-new .btn{width:100%;text-align:left;background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.side-new .btn:hover{border-color:var(--cyan);color:var(--cyan)}
.slist{flex:1;min-height:0;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.s-empty{color:var(--muted);font-size:.74rem;padding:14px 8px;text-align:center;line-height:1.6}
.sitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:.83rem;border:1px solid transparent}
.sitem:hover{background:var(--panel2)}
.sitem.active{background:var(--panel2);border-color:var(--border)}
.sitem.active .t{color:var(--cyan)}
.sitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.sitem .d{font-size:.62rem;color:var(--muted);flex:none;font-family:var(--mono)}
.sitem .x{flex:none;width:20px;height:20px;line-height:18px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);opacity:0;padding:0;font-size:.8rem}
.sitem:hover .x{opacity:1}
.sitem .x:hover{color:var(--red);border-color:var(--red)}

.settings{border-top:1px solid var(--border);padding:10px 14px 4px;font-size:.8rem}
.settings summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;list-style:none;user-select:none;padding:4px 0}
.settings summary::-webkit-details-marker{display:none}
.settings summary:hover{color:var(--cyan)}
.settings-body{padding-top:6px;display:flex;flex-direction:column;gap:4px}
.settings h3{margin:8px 0 0;font-family:var(--mono);font-size:.68rem;color:var(--cyan);letter-spacing:.12em;font-weight:600}
.settings label{font-size:.74rem;color:var(--muted);margin-top:4px;display:block}
.settings textarea{min-height:70px;resize:vertical}
.side-foot{border-top:1px solid var(--border);padding:10px 14px}
.hint{font-size:.68rem;color:var(--muted);line-height:1.5;padding:0 14px 12px}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
#log{flex:1;overflow:auto;padding:18px 22px;font-family:var(--mono);font-size:.88rem;line-height:1.65;background:linear-gradient(180deg,#05090f,#070e18)}
.msg{display:grid;grid-template-columns:78px 1fr;gap:12px;margin-bottom:16px}
.tag{font-size:.75rem;font-weight:700;padding-top:2px;white-space:nowrap}
.msg.user .tag{color:var(--green)}
.msg.ai .tag{color:var(--cyan)}
.msg.sys .tag{color:var(--muted)}
.body{min-width:0;overflow-wrap:anywhere}
.msg.user .body{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.msg.ai .body{border-left:2px solid var(--cyan);padding-left:12px}
.body p{margin:0 0 8px}
.body p.err{color:var(--red)}
.body p.warn{color:var(--yellow)}
code.inline{background:var(--code);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:#7dd3fc}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{width:110px;height:82px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.cursor{color:var(--cyan);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.code{margin:10px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--code)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#0a1826;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--muted)}
.code pre{margin:0;padding:12px;overflow:auto;color:#cbe7ff;font-size:.82rem;line-height:1.5}
.copy{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.7rem}
.copy:hover{color:var(--cyan);border-color:var(--cyan)}

.composer{border-top:1px solid var(--border);background:var(--panel);padding:12px 18px 14px}
.prompt-wrap{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:8px}
.prompt-wrap:focus-within{border-color:var(--cyan)}
#prompt{border:0;padding:6px;resize:none;min-height:44px;max-height:240px;background:transparent;font-family:var(--mono);line-height:1.5}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:.72rem;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.tools .l{display:flex;gap:8px;align-items:center}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--border);max-height:42vh}
  header{grid-column:auto}
  .msg{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>

<!-- ===== ログイン（ゲート） ===== -->
<section id="gate">
  <form class="card" id="gateForm" autocomplete="on">
    <div class="brand">
      <div class="mark">獺</div>
      <div><h1>獺祭 AI コンソール</h1><small>BLUE GANG / SECURE ACCESS</small></div>
    </div>
    <label for="gid">ログインID</label>
    <input id="gid" name="username" autocomplete="username" required>
    <label for="gpw">パスワード</label>
    <input id="gpw" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" style="width:100%;margin-top:18px">ログイン</button>
    <div class="err" id="gateErr"></div>
    <div class="note">ヘルパー（server.py）が起動している必要があります。ログイン後の操作はすべてヘルパーが認証を確認します。opencode のモデルを使用します。</div>
  </form>
</section>

<!-- ===== 操作画面 ===== -->
<section id="app" hidden>
  <header>
    <div class="ttl"><b>$</b> dassai-ai · opencode</div>
    <div class="ctrls">
      <span class="pill" id="pill">確認中…</span>
      <button class="btn sm" id="btnStart" type="button">起動</button>
      <button class="btn sm danger" id="btnStop" type="button">終了</button>
      <button class="btn sm ghost" id="btnRefresh" type="button">更新</button>
      <button class="btn sm ghost" id="btnLogout" type="button">ログアウト</button>
    </div>
  </header>

  <aside>
    <div class="side-head">
      <div class="side-brand"><span class="mark sm">獺</span><div>獺祭 AI<small>OPENCODE</small></div></div>
    </div>
    <div class="side-new"><button class="btn" id="btnNew" type="button">＋ 新しいチャット</button></div>
    <div class="slist" id="slist"></div>
    <details class="settings">
      <summary>⚙ 設定</summary>
      <div class="settings-body">
        <h3>PROJECT</h3>
        <label for="dir">作業ディレクトリ（opencode の起点）</label>
        <input id="dir" placeholder="例: C:\projects\my-app">
        <h3>MODEL</h3>
        <label for="model">使用するモデル（無料のみ）</label>
        <select id="model"><option value="">（読み込み中）</option></select>
        <button class="btn sm ghost" id="btnModels" type="button">モデル一覧を再読み込み</button>
        <label for="sys">システムプロンプト（任意）</label>
        <textarea id="sys" placeholder="例: 日本語で簡潔に答えてください。"></textarea>
      </div>
    </details>
    <div class="side-foot"><button class="btn sm danger" id="btnClear" type="button" style="width:100%">すべての履歴を消去</button></div>
    <div class="hint">「起動」で opencode サーバを開始します。ディレクトリを変えたら「起動」を押し直してください。</div>
  </aside>

  <main>
    <div id="log"></div>
    <div class="composer">
      <div class="prompt-wrap">
        <textarea id="prompt" rows="1" placeholder="プロンプトを入力（Enterで送信 / Shift+Enterで改行）"></textarea>
      </div>
      <div class="tools">
        <div class="l"><span id="count">0 文字</span></div>
        <div class="l">
          <button class="btn sm danger" id="btnStopChat" type="button" disabled>■ 停止</button>
          <button class="btn" id="btnSend" type="button">送信 ▶</button>
        </div>
      </div>
    </div>
  </main>
</section>

<script>
(function(){
'use strict';
var HELPER = 'http://127.0.0.1:8765';
var TOKEN_KEY = 'dassai_ai_token';
var $ = function(s){ return document.querySelector(s); };

var token = sessionStorage.getItem(TOKEN_KEY) || '';
var SESS_KEY = 'dassai_sessions_v1';
var CUR_KEY = 'dassai_current_v1';
var sessions = [];      // [{id,title,ts,shown:[{role,text}],sys}]
var current = null;     // 現在開いているセッション
var chatBusy = false;   // 生成中
var opBusy = false;     // 起動・終了中
var ctrl = null;        // 中断用 AbortController
var pollTimer = null;
var running = false;

/* ---------- 表示ユーティリティ ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function inline(t){
  return esc(t).replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .split(/\n{2,}/).map(function(p){ return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
}
function codeBlock(lang, code){
  return '<div class="code"><div class="code-head"><span>' + esc(lang || 'text') +
    '</span><button class="copy" type="button">コピー</button></div><pre><code>' +
    esc(code.replace(/\n$/, '')) + '</code></pre></div>';
}
function render(md){
  var parts = String(md).split(/```([\w+-]*)\n?([\s\S]*?)```/g), html = '';
  for (var i = 0; i < parts.length; i++){
    var m = i % 3;
    if (m === 0){ if (parts[i]) html += inline(parts[i]); }
    else if (m === 1){ html += codeBlock(parts[i], parts[i+1] || ''); i++; }
  }
  return html;
}
function scrollLog(){ var l = $('#log'); l.scrollTop = l.scrollHeight; }
function appendMsg(role, text){
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var tag = role === 'user' ? 'you ›' : (role === 'sys' ? 'sys' : 'ai ›');
  wrap.innerHTML = '<div class="tag">' + tag + '</div><div class="body"></div>';
  var body = wrap.querySelector('.body');
  if (role === 'user'){
    body.innerHTML = inline(text);
  } else if (role === 'ai'){
    body.innerHTML = text ? render(text) : '<span class="cursor">▌</span>';
  } else {
    body.innerHTML = render(text);
  }
  $('#log').appendChild(wrap);
  scrollLog();
  return body;
}
function note(text, isErr){
  var b = appendMsg('sys', text);
  if (isErr) b.innerHTML = '<p class="err">' + esc(text) + '</p>';
}
$('#log').addEventListener('click', function(e){
  var b = e.target.closest('.copy');
  if (!b || !navigator.clipboard) return;
  var code = b.closest('.code').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function(){
    b.textContent = 'コピー済'; setTimeout(function(){ b.textContent = 'コピー'; }, 1200);
  }).catch(function(){});
});

/* ---------- ヘルパー通信 ---------- */
function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var init = Object.assign({}, opts, { headers: headers, cache: 'no-store' });
  return fetch(HELPER + path, init).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(j){
      if (res.status === 401 && path !== '/login'){
        expireSession('セッションの期限が切れました。再度ログインしてください。');
      }
      if (!res.ok){
        var err = new Error(j.message || ('HTTP ' + res.status));
        err.status = res.status;
        throw err;
      }
      return j;
    });
  }, function(){
    var err = new Error('ヘルパーに接続できません（python server.py が起動しているか確認してください）');
    err.offline = true;
    throw err;
  });
}

/* ---------- ゲート（ログイン） ---------- */
function showGate(msg){
  stopPolling();
  $('#app').hidden = true;
  $('#gate').hidden = false;
  $('#gateErr').textContent = msg || '';
  setTimeout(function(){ $('#gid').focus(); }, 0);
}
function showApp(){
  $('#gate').hidden = true;
  $('#app').hidden = false;
  renderLog();
  renderSessions();
  startPolling();
  loadModels();
  $('#prompt').focus();
}
function expireSession(msg){
  sessionStorage.removeItem(TOKEN_KEY);
  token = '';
  showGate(msg);
}

$('#gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  $('#gateErr').textContent = '';
  api('/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id: $('#gid').value.trim(), pw: $('#gpw').value }) })
    .then(function(j){
      token = j.token;
      sessionStorage.setItem(TOKEN_KEY, token);
      $('#gpw').value = '';
      showApp();
    })
    .catch(function(err){ $('#gateErr').textContent = err.message; });
});

$('#btnLogout').addEventListener('click', function(){
  api('/logout', { method: 'POST' }).catch(function(){}).then(function(){
    expireSession('ログアウトしました。');
  });
});

/* ---------- opencode 起動・終了・状態 ---------- */
function setPill(cls, text){ var p = $('#pill'); p.className = 'pill ' + cls; p.textContent = text; }
function setCtlButtons(){
  var busy = opBusy;
  $('#btnStart').disabled = busy || running;
  $('#btnStop').disabled = busy || !running;
  $('#btnRefresh').disabled = busy;
}
function refreshStatus(){
  if (opBusy) return Promise.resolve();
  return api('/status').then(function(j){
    running = !!j.running;
    if (j.directory && !$('#dir').value) $('#dir').value = j.directory;
    setPill(running ? 'on' : 'off', running ? 'opencode 稼働中' + (j.managed ? '（ヘルパー起動）' : '') : 'opencode 停止中');
    setCtlButtons();
  }).catch(function(err){
    running = false;
    setPill('err', err.offline ? 'ヘルパー未接続' : err.message);
    setCtlButtons();
  });
}
function controlServer(path, label, body){
  if (opBusy) return;
  opBusy = true;
  setPill('wait', label);
  setCtlButtons();
  api(path, { method: 'POST', headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined })
    .then(function(j){ note(j.message || '完了'); })
    .catch(function(err){ note('エラー: ' + err.message, true); })
    .then(function(){
      opBusy = false;
      setCtlButtons();
      return refreshStatus();
    })
    .then(function(){ loadModels(); });
}
$('#btnStart').addEventListener('click', function(){
  controlServer('/start', '起動中…', { directory: $('#dir').value.trim() });
});
$('#btnStop').addEventListener('click', function(){
  if (chatBusy && ctrl) ctrl.abort();
  controlServer('/stop', '終了中…');
});
$('#btnRefresh').addEventListener('click', function(){ refreshStatus(); loadModels(); });

function startPolling(){ stopPolling(); refreshStatus(); pollTimer = setInterval(refreshStatus, 5000); }
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* ---------- モデル一覧（無料のみ表示） ---------- */
function isFreeModel(m){
  var s = String(m).toLowerCase();
  var paid = ['pro','enterprise','plus','ultra','max','team','turbo','bedrock','vertex','-128k','-200k','gpt-4.1','gpt-5','claude-4','claude-sonnet-4','claude-opus','o3-','o4-','gemini-2.5-pro','gemini-pro-2.5'];
  for (var i=0;i<paid.length;i++) if (s.indexOf(paid[i])>=0) return false;
  var freeHints = ['free','local','community','qwen','llama','gemma','deepseek','mistral','phi','hermes','smollm','yi','moonshot','cogito','granite','llava','codellama'];
  for (var j=0;j<freeHints.length;j++) if (s.indexOf(freeHints[j])>=0) return true;
  return true;
}
function loadModels(){
  var sel = $('#model');
  var keep = sel.value;
  return api('/models').then(function(j){
    sel.innerHTML = '';
    if (!j.models.length){
      sel.innerHTML = '<option value="">（モデルなし: opencode の認証を確認）</option>';
      return;
    }
    var list = j.models.filter(isFreeModel);
    if (!list.length) list = j.models.slice();
    list.forEach(function(m){
      var o = document.createElement('option');
      o.value = m; o.textContent = m; sel.appendChild(o);
    });
    if (keep && list.indexOf(keep) >= 0) sel.value = keep;
    else if (j.default && list.indexOf(j.default) >= 0) sel.value = j.default;
  }).catch(function(err){
    if (err.status === 401) return;
    sel.innerHTML = '<option value="">（opencode 停止中・起動してください）</option>';
  });
}
$('#btnModels').addEventListener('click', loadModels);

/* ---------- セッション（チャット履歴）管理 ---------- */
function uid(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function titleOf(shown){
  if (!shown || !shown.length) return '';
  for (var i=0;i<shown.length;i++){ if (shown[i].role === 'user' && shown[i].text) return shown[i].text.slice(0, 48); }
  return '';
}
function relTime(ts){
  if (!ts) return '';
  var d = new Date(ts), n = new Date();
  function p(x){ return (x < 10 ? '0' : '') + x; }
  if (d.toDateString() === n.toDateString()) return p(d.getHours()) + ':' + p(d.getMinutes());
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function loadStore(){
  try { sessions = JSON.parse(localStorage.getItem(SESS_KEY) || '[]') || []; } catch (e) { sessions = []; }
  if (!Array.isArray(sessions)) sessions = [];
  var cid = null;
  try { cid = localStorage.getItem(CUR_KEY); } catch (e) { cid = null; }
  current = null;
  for (var i=0;i<sessions.length;i++){ if (sessions[i].id === cid){ current = sessions[i]; break; } }
}
function saveStore(){
  try {
    localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
    if (current) localStorage.setItem(CUR_KEY, current.id);
    else localStorage.removeItem(CUR_KEY);
  } catch (e) {
    note('履歴の保存に失敗しました（容量超過の可能性）。', true);
  }
}
function migrateLegacy(){
  if (sessions.length) return;
  var changed = false;
  var old = null;
  try { old = JSON.parse(localStorage.getItem('dassai_chat_history_v1') || 'null'); } catch (e) { old = null; }
  if (Array.isArray(old)){
    old.forEach(function(h){
      sessions.push({ id: uid(), title: h.name || 'チャット', ts: h.ts || Date.now(), shown: h.shown || [], sys: h.sys || '' });
      changed = true;
    });
  }
  try {
    var cur = JSON.parse(localStorage.getItem('dassai_chat_v1') || 'null');
    if (cur && Array.isArray(cur.shown) && cur.shown.length){
      sessions.push({ id: uid(), title: titleOf(cur.shown) || 'チャット', ts: Date.now(), shown: cur.shown, sys: cur.sys || '' });
      changed = true;
    }
  } catch (e) {}
  if (changed){ current = sessions[sessions.length - 1]; saveStore(); }
}
function renderSessions(){
  var list = $('#slist');
  if (!list) return;
  if (!sessions.length){
    list.innerHTML = '<div class="s-empty">まだチャットがありません。<br>「＋ 新しいチャット」から始めましょう。</div>';
    return;
  }
  var sorted = sessions.slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
  list.innerHTML = sorted.map(function(s){
    var active = current && s.id === current.id;
    var title = s.title || titleOf(s.shown) || '新しいチャット';
    return '<div class="sitem' + (active ? ' active' : '') + '" data-id="' + s.id + '">' +
      '<div class="t">' + esc(title) + '</div>' +
      '<div class="d">' + relTime(s.ts) + '</div>' +
      '<button class="x" type="button" data-del="' + s.id + '" title="削除">×</button>' +
    '</div>';
  }).join('');
}
function renderLog(){
  $('#log').innerHTML = '';
  if (current && Array.isArray(current.shown) && current.shown.length){
    current.shown.forEach(function(m){ appendMsg(m.role === 'user' ? 'user' : 'ai', m.text || ''); });
  } else {
    note('新規チャット。下の入力欄からメッセージを送ってください。');
  }
}
function openSession(id){
  if (chatBusy) return;
  var s = null;
  for (var i=0;i<sessions.length;i++){ if (sessions[i].id === id){ s = sessions[i]; break; } }
  if (!s) return;
  current = s;
  $('#sys').value = s.sys || '';
  renderLog();
  renderSessions();
  saveStore();
  $('#prompt').focus();
}
function deleteSession(id){
  if (chatBusy) return;
  sessions = sessions.filter(function(x){ return x.id !== id; });
  if (current && current.id === id){
    current = null;
    $('#sys').value = '';
    renderLog();
  }
  saveStore();
  renderSessions();
}
function newChat(){
  if (chatBusy) return;
  current = null;
  $('#sys').value = '';
  $('#log').innerHTML = '';
  api('/new', { method: 'POST' }).catch(function(){});
  renderSessions();
  saveStore();
  note('新しいチャットを開始しました。');
  $('#prompt').focus();
}
$('#btnNew').addEventListener('click', newChat);
$('#slist').addEventListener('click', function(e){
  var del = e.target.closest('[data-del]');
  if (del){
    e.stopPropagation();
    if (confirm('このチャットを削除しますか？')) deleteSession(del.getAttribute('data-del'));
    return;
  }
  var item = e.target.closest('[data-id]');
  if (item) openSession(item.getAttribute('data-id'));
});
$('#btnClear').addEventListener('click', function(){
  if (chatBusy) return;
  if (!confirm('保存されているすべてのチャット履歴を消去します。よろしいですか？')) return;
  sessions = [];
  current = null;
  $('#sys').value = '';
  $('#log').innerHTML = '';
  api('/new', { method: 'POST' }).catch(function(){});
  saveStore();
  renderSessions();
  note('すべての履歴を消去しました。');
});

/* ---------- 入力欄 ---------- */
var prompt = $('#prompt');

function autoResize(){
  prompt.style.height = 'auto';
  prompt.style.height = Math.min(prompt.scrollHeight, 240) + 'px';
  $('#count').textContent = prompt.value.length + ' 文字';
}
prompt.addEventListener('input', autoResize);
prompt.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

/* ---------- 送信・ストリーミング ---------- */
function setChatUi(){
  $('#btnSend').disabled = chatBusy;
  $('#btnStopChat').disabled = !chatBusy;
}
function send(){
  if (chatBusy) return;
  var text = prompt.value.trim();
  if (!text) return;
  var model = $('#model').value;
  if (!model){
    note('モデルが選択されていません。opencode を起動し、モデルを選んでください。', true);
    return;
  }

  prompt.value = ''; autoResize();

  if (!current){
    current = { id: uid(), title: '', ts: Date.now(), shown: [], sys: $('#sys').value };
    sessions.push(current);
  }
  current.sys = $('#sys').value;
  if (!current.title) current.title = text.slice(0, 48);
  current.ts = Date.now();

  appendMsg('user', text);
  var userShown = { role: 'user', text: text };
  current.shown.push(userShown);
  saveStore(); renderSessions();
  var aiBody = appendMsg('ai', '');

  var sysText = $('#sys').value.trim();
  var session = current;

  chatBusy = true; setChatUi();
  ctrl = new AbortController();
  var acc = '', ok = false;

  fetch(HELPER + '/chat', {
    method: 'POST',
    signal: ctrl.signal,
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ model: model, text: text, system: sysText })
  }).then(function(res){
    if (!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        if (res.status === 401){ expireSession('セッションの期限が切れました。再度ログインしてください。'); throw new Error('ログインが必要です'); }
        throw new Error(j.message || ('HTTP ' + res.status));
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder('utf-8');
    var buf = '', finished = false;

    function handleLine(line){
      if (!line.trim()) return;
      var obj = JSON.parse(line);
      if (obj.error) throw new Error(obj.error);
      if (obj.message && obj.message.content) acc += obj.message.content;
      if (obj.done) finished = true;
    }
    function pump(){
      return reader.read().then(function(r){
        if (r.done){
          if (buf.trim()) handleLine(buf);
          return;
        }
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) >= 0){
          var line = buf.slice(0, idx); buf = buf.slice(idx + 1);
          handleLine(line);
        }
        aiBody.innerHTML = render(acc) + '<span class="cursor">▌</span>';
        scrollLog();
        return pump();
      });
    }
    return pump().then(function(){
      aiBody.innerHTML = render(acc || '（空の応答）');
      ok = true;
    });
  }).catch(function(err){
    if (err && err.name === 'AbortError'){
      aiBody.innerHTML = render(acc) + '<p class="warn">（生成を中断しました）</p>';
      ok = !!acc;
    } else if (err instanceof TypeError){
      aiBody.innerHTML = '<p class="err">ヘルパーに接続できません（server.py を確認してください）</p>';
    } else {
      aiBody.innerHTML = '<p class="err">エラー: ' + esc(err.message || String(err)) + '</p>';
    }
  }).then(function(){
    if (ok){
      session.shown.push({ role: 'ai', text: acc });
    } else {
      var j = session.shown.lastIndexOf(userShown); if (j >= 0) session.shown.splice(j, 1);
      if (!session.shown.length){
        sessions = sessions.filter(function(x){ return x.id !== session.id; });
        if (current && current.id === session.id) current = null;
      }
    }
    session.ts = Date.now();
    saveStore(); renderSessions();
    chatBusy = false; ctrl = null;
    setChatUi();
    scrollLog();
    prompt.focus();
  });
}
$('#btnSend').addEventListener('click', send);
$('#btnStopChat').addEventListener('click', function(){ if (ctrl) ctrl.abort(); });
$('#sys').addEventListener('input', function(){
  if (current){ current.sys = $('#sys').value; saveStore(); }
});

/* ---------- 起動 ---------- */
function boot(){
  loadStore();
  migrateLegacy();
  if (!token){ showGate(''); return; }
  api('/me').then(function(){ showApp(); }).catch(function(err){
    if (err.status === 401){ showGate('ログインが必要です。'); return; }
    showGate(err.message);
  });
}
boot();
})();
</script>
