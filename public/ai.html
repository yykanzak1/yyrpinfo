<title>獺祭 AI コンソール ｜Blue Gang</title>
<style>
:root{--bg:#060b12;--panel:#0a1420;--panel2:#0e1c2c;--border:#15324a;--cyan:#00c8ff;--text:#d7e6f2;--muted:#6f8aa0;--green:#4ade80;--red:#ff6b6b;--yellow:#facc15;--code:#050c15;
--mono:"Cascadia Code",Consolas,Menlo,"Noto Sans Mono CJK JP",monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--text);background:var(--code);border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
.btn{background:linear-gradient(135deg,#0070d8,#00b4ff);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600}
.btn.ghost:not(:disabled):hover{border-color:var(--cyan);color:var(--cyan)}
.btn.danger{background:#8b2a2a}
.btn.sm{padding:6px 10px;font-size:.8rem}

/* ----- gate (login) ----- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 25%,#06243a 0%,#060b12 65%)}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 0 42px rgba(0,200,255,.12)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:10px;flex:none;background:linear-gradient(135deg,#0a2d4d,#0088ff);display:grid;place-items:center;font-weight:900;color:#fff}
.brand h1{font-size:1.05rem;margin:0;letter-spacing:.04em}
.brand small{color:var(--cyan);font-family:var(--mono);font-size:.7rem;letter-spacing:.08em}
.card label{display:block;font-size:.8rem;color:var(--muted);margin:14px 0 6px}
.err{color:var(--red);font-size:.82rem;min-height:1.2em;margin-top:10px;word-break:break-all}
.note{font-size:.72rem;color:var(--muted);margin-top:14px;line-height:1.6}

/* ----- app ----- */
#app{height:100vh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:230px 260px 1fr}
header{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
header .ttl{font-family:var(--mono);font-size:.9rem}
header .ttl b{color:var(--cyan)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.75rem;padding:5px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.pill.on{color:var(--green);border-color:rgba(74,222,128,.4)}
.pill.off{color:var(--muted)}
.pill.wait{color:var(--yellow);border-color:rgba(250,204,21,.4)}
.pill.err{color:var(--red);border-color:rgba(255,107,107,.4)}

aside{background:var(--panel);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
aside h3{margin:6px 0 0;font-family:var(--mono);font-size:.72rem;color:var(--cyan);letter-spacing:.12em;font-weight:600}
aside label{font-size:.78rem;color:var(--muted);margin-top:4px}
aside textarea{min-height:90px;resize:vertical}
.hint{font-size:.7rem;color:var(--muted);line-height:1.55}

#hist{background:var(--panel);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#hist h3{margin:0;font-family:var(--mono);font-size:.72rem;color:var(--cyan);letter-spacing:.12em;font-weight:600}
.hist-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.chat-item{display:flex;align-items:center;gap:6px;padding:8px 9px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:.8rem;color:var(--text)}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:var(--panel2);border-color:var(--cyan)}
.chat-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del{opacity:.5;border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:5px;flex:none}
.chat-item .del:hover{color:var(--red);opacity:1}

main{display:flex;flex-direction:column;min-width:0;min-height:0}
#log{flex:1;overflow:auto;padding:18px 22px;font-family:var(--mono);font-size:.88rem;line-height:1.65;background:linear-gradient(180deg,#05090f,#070e18)}
.msg{display:grid;grid-template-columns:78px 1fr;gap:12px;margin-bottom:16px}
.tag{font-size:.75rem;font-weight:700;padding-top:2px;white-space:nowrap}
.msg.user .tag{color:var(--green)}
.msg.ai .tag{color:var(--cyan)}
.msg.sys .tag{color:var(--muted)}
.body{min-width:0;overflow-wrap:anywhere}
.msg.user .body{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.msg.ai .body{border-left:2px solid var(--cyan);padding-left:12px}
.body p{margin:0 0 8px}
.body p.err{color:var(--red)}
.body p.warn{color:var(--yellow)}
code.inline{background:var(--code);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:#7dd3fc}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{width:110px;height:82px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.cursor{color:var(--cyan);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.code{margin:10px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--code)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:#0a1826;border-bottom:1px solid var(--border);font-size:.72rem;color:var(--muted)}
.code pre{margin:0;padding:12px;overflow:auto;color:#cbe7ff;font-size:.82rem;line-height:1.5}
.copy{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.7rem}
.copy:hover{color:var(--cyan);border-color:var(--cyan)}

.composer{border-top:1px solid var(--border);background:var(--panel);padding:12px 18px 14px}
.attachments{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.attachments:empty{display:none}
.att{position:relative;width:72px;height:72px;border:1px solid var(--cyan);border-radius:8px;overflow:hidden}
.att img{width:100%;height:100%;object-fit:cover}
.att button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;padding:0;line-height:20px}
.prompt-wrap{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:8px}
.prompt-wrap:focus-within{border-color:var(--cyan)}
#prompt{border:0;padding:6px;resize:none;min-height:44px;max-height:240px;background:transparent;font-family:var(--mono);line-height:1.5}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:.72rem;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.tools .l{display:flex;gap:8px;align-items:center}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  #hist{border-right:0;border-bottom:1px solid var(--border);max-height:200px}
  aside{border-right:0;border-bottom:1px solid var(--border);max-height:260px}
  header{grid-column:auto}
  .msg{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>

<!-- ===== ログイン（ゲート） ===== -->
<section id="gate">
  <form class="card" id="gateForm" autocomplete="on">
    <div class="brand">
      <div class="mark">獺</div>
      <div><h1>獺祭 AI コンソール</h1><small>BLUE GANG / SECURE ACCESS</small></div>
    </div>
    <label for="gid">ログインID</label>
    <input id="gid" name="username" autocomplete="username" required>
    <label for="gpw">パスワード</label>
    <input id="gpw" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" style="width:100%;margin-top:18px">ログイン</button>
    <div class="err" id="gateErr"></div>
    <div class="note">ヘルパー（server.py）が起動している必要があります。ログイン後の操作はすべてヘルパーが認証を確認します。</div>
  </form>
</section>

<!-- ===== 操作画面 ===== -->
<section id="app" hidden>
  <header>
    <div class="ttl"><b>$</b> dassai-ai · ollama</div>
    <div class="ctrls">
      <span class="pill" id="pill">確認中…</span>
      <button class="btn sm" id="btnStart" type="button">起動</button>
      <button class="btn sm danger" id="btnStop" type="button">終了</button>
      <button class="btn sm ghost" id="btnRefresh" type="button">更新</button>
      <button class="btn sm ghost" id="btnLogout" type="button">ログアウト</button>
    </div>
  </header>

  <aside id="hist">
    <h3>CHATS</h3>
    <button class="btn sm" id="btnNew" type="button">＋ 新しいチャット</button>
    <div class="hist-list" id="histList"></div>
  </aside>

  <aside>
    <h3>AI</h3>
    <label for="sys">システムプロンプト（任意）</label>
    <textarea id="sys" placeholder="例: 日本語で簡潔に答えてください。"></textarea>
    <button class="btn sm danger" id="btnClear" type="button" style="margin-top:auto">すべての履歴を消去</button>
    <div class="hint">モデルは固定です（画像とファイル操作の両対応）。起動・終了はヘルパー経由で行います。</div>
  </aside>

  <main>
    <div id="log"></div>
    <div class="composer">
      <div class="attachments" id="attachments"></div>
      <div class="prompt-wrap">
        <textarea id="prompt" rows="1" placeholder="プロンプトを入力（Enterで送信 / Shift+Enterで改行）。画像は貼り付け・ドラッグ・📎で添付"></textarea>
      </div>
      <div class="tools">
        <div class="l">
          <button class="btn sm ghost" id="btnAttach" type="button">📎 画像を添付</button>
          <input id="fileInput" type="file" accept="image/*" multiple hidden>
          <span id="count">0 文字</span>
        </div>
        <div class="l">
          <button class="btn sm danger" id="btnAbort" type="button" hidden>生成を中断</button>
          <button class="btn" id="btnSend" type="button">送信 ▶</button>
        </div>
      </div>
    </div>
  </main>
</section>

<script>
(function(){
'use strict';
var HELPER = 'http://127.0.0.1:8765';
var TOKEN_KEY = 'dassai_ai_token';
var MAX_IMG = 8 * 1024 * 1024;
var $ = function(s){ return document.querySelector(s); };

var token = sessionStorage.getItem(TOKEN_KEY) || '';
var messages = [];      // 現在の会話（Ollama の messages 形式）
var shown = [];         // 現在の会話の表示用履歴 {role,text,imgs:[{name,dataUrl}]}
var pending = [];       // 添付中の画像 {name,type,dataUrl}
var chatBusy = false;   // 生成中
var opBusy = false;     // 起動・終了中
var ctrl = null;        // 中断用 AbortController
var pollTimer = null;
var running = false;
var CHATS_KEY = 'dassai_chats_v2';  // 複数チャット保存 {v:2,currentId,conversations:[{id,title,createdAt,updatedAt,messages,shown,sys}]}
var OLD_KEY = 'dassai_chat_v1';     // 旧・単一会話データ（移行用）
var store = { v: 2, currentId: null, conversations: [] };

/* ---------- 表示ユーティリティ ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function inline(t){
  return esc(t).replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .split(/\n{2,}/).map(function(p){ return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
}
function codeBlock(lang, code){
  return '<div class="code"><div class="code-head"><span>' + esc(lang || 'text') +
    '</span><button class="copy" type="button">コピー</button></div><pre><code>' +
    esc(code.replace(/\n$/, '')) + '</code></pre></div>';
}
function render(md){
  var parts = String(md).split(/```([\w+-]*)\n?([\s\S]*?)```/g), html = '';
  for (var i = 0; i < parts.length; i++){
    var m = i % 3;
    if (m === 0){ if (parts[i]) html += inline(parts[i]); }
    else if (m === 1){ html += codeBlock(parts[i], parts[i+1] || ''); i++; }
  }
  return html;
}
function scrollLog(){ var l = $('#log'); l.scrollTop = l.scrollHeight; }
function appendMsg(role, text, imgs){
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var tag = role === 'user' ? 'you ›' : (role === 'sys' ? 'sys' : 'ai ›');
  wrap.innerHTML = '<div class="tag">' + tag + '</div><div class="body"></div>';
  var body = wrap.querySelector('.body');
  if (role === 'user'){
    body.innerHTML = (text ? inline(text) : '<p><em>(画像のみ)</em></p>') +
      (imgs && imgs.length ? '<div class="thumbs">' + imgs.map(function(i){ return '<img src="' + esc(i.dataUrl) + '" alt="' + esc(i.name) + '">'; }).join('') + '</div>' : '');
  } else if (role === 'ai'){
    body.innerHTML = text ? render(text) : '<span class="cursor">▌</span>';
  } else {
    body.innerHTML = render(text);
  }
  $('#log').appendChild(wrap);
  scrollLog();
  return body;
}
function note(text, isErr){
  var b = appendMsg('sys', text);
  if (isErr) b.innerHTML = '<p class="err">' + esc(text) + '</p>';
}
$('#log').addEventListener('click', function(e){
  var b = e.target.closest('.copy');
  if (!b || !navigator.clipboard) return;
  var code = b.closest('.code').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function(){
    b.textContent = 'コピー済'; setTimeout(function(){ b.textContent = 'コピー'; }, 1200);
  }).catch(function(){});
});

/* ---------- ヘルパー通信 ---------- */
function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var init = Object.assign({}, opts, { headers: headers, cache: 'no-store' });
  return fetch(HELPER + path, init).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(j){
      if (res.status === 401 && path !== '/login'){
        expireSession('セッションの期限が切れました。再度ログインしてください。');
      }
      if (!res.ok){
        var err = new Error(j.message || ('HTTP ' + res.status));
        err.status = res.status;
        throw err;
      }
      return j;
    });
  }, function(){
    var err = new Error('ヘルパーに接続できません（python server.py が起動しているか確認してください）');
    err.offline = true;
    throw err;
  });
}

/* ---------- ゲート（ログイン） ---------- */
function showGate(msg){
  stopPolling();
  $('#app').hidden = true;
  $('#gate').hidden = false;
  $('#gateErr').textContent = msg || '';
  setTimeout(function(){ $('#gid').focus(); }, 0);
}
function showApp(){
  $('#gate').hidden = true;
  $('#app').hidden = false;
  renderHistList();
  if (!$('#log').childElementCount) restoreChat();
  startPolling();
  $('#prompt').focus();
}
function expireSession(msg){
  sessionStorage.removeItem(TOKEN_KEY);
  token = '';
  showGate(msg);
}

$('#gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  $('#gateErr').textContent = '';
  api('/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id: $('#gid').value.trim(), pw: $('#gpw').value }) })
    .then(function(j){
      token = j.token;
      sessionStorage.setItem(TOKEN_KEY, token);
      $('#gpw').value = '';
      if (!restoreChat()) note('ログインしました。プロンプトを入力できます。');
      showApp();
    })
    .catch(function(err){ $('#gateErr').textContent = err.message; });
});

$('#btnLogout').addEventListener('click', function(){
  api('/logout', { method: 'POST' }).catch(function(){}).then(function(){
    expireSession('ログアウトしました。');
  });
});

/* ---------- Ollama 起動・終了・状態 ---------- */
function setPill(cls, text){ var p = $('#pill'); p.className = 'pill ' + cls; p.textContent = text; }
function setCtlButtons(){
  var busy = opBusy;
  $('#btnStart').disabled = busy || running;
  $('#btnStop').disabled = busy || !running;
  $('#btnRefresh').disabled = busy;
}
function refreshStatus(){
  if (opBusy) return Promise.resolve();
  return api('/status').then(function(j){
    running = !!j.running;
    setPill(running ? 'on' : 'off', running ? 'Ollama 稼働中' + (j.managed ? '（ヘルパー起動）' : '') : 'Ollama 停止中');
    setCtlButtons();
  }).catch(function(err){
    running = false;
    setPill('err', err.offline ? 'ヘルパー未接続' : err.message);
    setCtlButtons();
  });
}
function controlOllama(path, label){
  if (opBusy) return;
  opBusy = true;
  setPill('wait', label);
  setCtlButtons();
  api(path, { method: 'POST' })
    .then(function(j){ note(j.message || '完了'); })
    .catch(function(err){ note('エラー: ' + err.message, true); })
    .then(function(){
      opBusy = false;
      setCtlButtons();
      return refreshStatus();
    });
}
$('#btnStart').addEventListener('click', function(){ controlOllama('/start', '起動中…'); });
$('#btnStop').addEventListener('click', function(){
  if (chatBusy && ctrl) ctrl.abort();
  controlOllama('/stop', '終了中…');
});
$('#btnRefresh').addEventListener('click', function(){ refreshStatus(); });

function startPolling(){ stopPolling(); refreshStatus(); pollTimer = setInterval(refreshStatus, 5000); }
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* ---------- モデルはヘルパー側で固定（画像＋ファイル操作の両対応） ---------- */

/* ---------- 画像添付 ---------- */
function renderPending(){
  $('#attachments').innerHTML = pending.map(function(a, i){
    return '<div class="att"><img src="' + esc(a.dataUrl) + '" alt="' + esc(a.name) + '">' +
      '<button type="button" data-rm="' + i + '" aria-label="削除">×</button></div>';
  }).join('');
}
function downscale(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 1024, w = img.width, h = img.height;
      if (w > max || h > max){ var s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(null); };
  fr.readAsDataURL(file);
}
function addFiles(list){
  Array.prototype.forEach.call(list || [], function(f){
    if (!f.type || f.type.indexOf('image/') !== 0) return;
    if (f.size > MAX_IMG){ note('「' + f.name + '」は8MBを超えるため添付できません。', true); return; }
    downscale(f, function(dataUrl){
      if (!dataUrl){ note('「' + f.name + '」を読み込めませんでした。', true); return; }
      pending.push({ name: f.name, type: 'image/jpeg', dataUrl: dataUrl });
      renderPending();
    });
  });
}
$('#attachments').addEventListener('click', function(e){
  var b = e.target.closest('[data-rm]');
  if (!b) return;
  pending.splice(Number(b.getAttribute('data-rm')), 1);
  renderPending();
});
$('#btnAttach').addEventListener('click', function(){ $('#fileInput').click(); });
$('#fileInput').addEventListener('change', function(e){ addFiles(e.target.files); e.target.value = ''; });

var prompt = $('#prompt');
prompt.addEventListener('paste', function(e){
  var files = Array.prototype.slice.call((e.clipboardData && e.clipboardData.items) || [])
    .filter(function(i){ return i.kind === 'file' && i.type.indexOf('image/') === 0; })
    .map(function(i){ return i.getAsFile(); }).filter(Boolean);
  if (files.length){ e.preventDefault(); addFiles(files); }
});
var main = document.querySelector('main');
main.addEventListener('dragover', function(e){ e.preventDefault(); });
main.addEventListener('drop', function(e){ e.preventDefault(); addFiles(e.dataTransfer.files); });

function autoResize(){
  prompt.style.height = 'auto';
  prompt.style.height = Math.min(prompt.scrollHeight, 240) + 'px';
  $('#count').textContent = prompt.value.length + ' 文字';
}
prompt.addEventListener('input', autoResize);
prompt.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

/* ---------- 送信・ストリーミング ---------- */
function setChatUi(){
  $('#btnSend').disabled = chatBusy;
  $('#btnAbort').hidden = !chatBusy;
}
function send(){
  if (chatBusy) return;
  var text = prompt.value.trim();
  if (!text && !pending.length) return;

  var imgs = pending.slice();
  pending = []; renderPending();
  prompt.value = ''; autoResize();

  var userMsg = { role: 'user', content: text || '画像について説明してください。' };
  if (imgs.length) userMsg.images = imgs.map(function(i){ return i.dataUrl.split(',')[1]; });
  messages.push(userMsg);
  appendMsg('user', text, imgs);
  var userShown = { role: 'user', text: text, imgs: imgs.map(function(i){ return { name: i.name, dataUrl: i.dataUrl }; }) };
  shown.push(userShown);
  saveChat();

  sendAgent($('#sys').value.trim(), userMsg, userShown);
}
$('#btnSend').addEventListener('click', send);
$('#btnClear').addEventListener('click', function(){ clearAllChats(); });
$('#btnAbort').addEventListener('click', function(){ if (ctrl) ctrl.abort(); });

/* ---------- エージェント（ファイル操作）送信 ---------- */
function short(s, n){ s = String(s == null ? '' : s); return s.length > (n || 300) ? s.slice(0, n || 300) + '…' : s; }
function finishAgent(ok, acc, userMsg, userShown, sysShown){
  if (ok && acc){
    messages.push({ role: 'assistant', content: acc });
    for (var k = 0; k < sysShown.length; k++) shown.push(sysShown[k]);
    shown.push({ role: 'ai', text: acc });
  } else {
    var i = messages.lastIndexOf(userMsg); if (i >= 0) messages.splice(i, 1);
    var j = shown.lastIndexOf(userShown); if (j >= 0) shown.splice(j, 1);
  }
  saveChat();
  chatBusy = false; ctrl = null;
  setChatUi();
  scrollLog();
  prompt.focus();
}
function sendAgent(sysText, userMsg, userShown){
  var payload = (sysText ? [{ role: 'system', content: sysText }] : []).concat(messages);
  chatBusy = true; setChatUi();
  ctrl = new AbortController();
  var acc = '', ok = false, sysShown = [];

  fetch(HELPER + '/agent', {
    method: 'POST',
    signal: ctrl.signal,
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ messages: payload })
  }).then(function(res){
    if (!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        if (res.status === 401){ expireSession('セッションの期限が切れました。再度ログインしてください。'); throw new Error('ログインが必要です'); }
        throw new Error(j.message || ('HTTP ' + res.status));
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder('utf-8');
    var buf = '';

    function handleLine(line){
      if (!line.trim()) return;
      var obj = JSON.parse(line);
      if (obj.type === 'tool_call'){
        var a = '';
        try { a = JSON.stringify(obj.arguments); } catch (e) { a = ''; }
        var t = '🔧 ' + obj.name + ' ' + short(a, 200);
        note(t);
        sysShown.push({ role: 'sys', text: t });
      } else if (obj.type === 'tool_result'){
        var t2 = (obj.ok ? '✓ ' : '✗ ') + obj.name + ': ' + short(obj.result, 300);
        note(t2, !obj.ok);
        sysShown.push({ role: 'sys', text: t2 });
      } else if (obj.type === 'final'){
        acc = obj.content || ''; ok = true;
      } else if (obj.type === 'error'){
        throw new Error(obj.message || 'エラー');
      }
    }
    function pump(){
      return reader.read().then(function(r){
        if (r.done){ if (buf.trim()) handleLine(buf); return; }
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) >= 0){
          var line = buf.slice(0, idx); buf = buf.slice(idx + 1);
          handleLine(line);
        }
        return pump();
      });
    }
    return pump();
  }).catch(function(err){
    if (err && err.name === 'AbortError'){
      note('（生成を中断しました）');
    } else if (err instanceof TypeError){
      note('ヘルパーに接続できません（server.py を確認してください）', true);
    } else {
      var m = String((err && err.message) || err);
      if (m.indexOf('multimodal') >= 0 || m.indexOf('does not support') >= 0){
        note('このモデルは画像に対応していません。ヘルパーを再起動してモデルを確認してください。', true);
      } else {
        note('エラー: ' + m, true);
      }
    }
  }).then(function(){
    if (ok && acc) appendMsg('ai', acc);
    finishAgent(ok && !!acc, acc, userMsg, userShown, sysShown);
  });
}

$('#btnNew').addEventListener('click', function(){ newChat(); });

/* ---------- 会話（複数チャット）の保存・切替（localStorage） ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function currentConv(){
  for (var i = 0; i < store.conversations.length; i++){
    if (store.conversations[i].id === store.currentId) return store.conversations[i];
  }
  return null;
}
function deriveTitle(shownArr){
  for (var i = 0; i < shownArr.length; i++){
    var m = shownArr[i];
    if (m && m.role === 'user' && m.text){
      var t = m.text.replace(/\s+/g, ' ').trim();
      if (t) return t.length > 40 ? t.slice(0, 40) + '…' : t;
    }
  }
  return '新しいチャット';
}
function emptyConv(){
  return { id: uid(), title: '', createdAt: Date.now(), updatedAt: Date.now(), messages: [], shown: [], sys: '' };
}
function loadStore(){
  var raw = null;
  try { raw = localStorage.getItem(CHATS_KEY); } catch (e) {}
  if (raw){
    try {
      var d = JSON.parse(raw);
      if (d && d.v === 2 && Array.isArray(d.conversations)) store = d;
    } catch (e) {}
  }
  if (!store.conversations.length){
    var old = null;
    try { old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); } catch (e) {}
    var conv = emptyConv();
    if (old){
      conv.messages = Array.isArray(old.messages) ? old.messages : [];
      conv.shown = Array.isArray(old.shown) ? old.shown : [];
      conv.sys = typeof old.sys === 'string' ? old.sys : '';
      conv.title = deriveTitle(conv.shown);
    }
    store = { v: 2, currentId: conv.id, conversations: [conv] };
    saveStore();
    try { localStorage.removeItem(OLD_KEY); } catch (e) {}
  }
  if (!currentConv()) store.currentId = store.conversations[0].id;
}
var quotaWarned = false;
function saveStore(){
  try { localStorage.setItem(CHATS_KEY, JSON.stringify(store)); quotaWarned = false; }
  catch (e) {
    if (!quotaWarned){
      quotaWarned = true;
      note('履歴の保存に失敗しました（保存容量の上限）。画像を減らすか、古いチャットを削除してください。', true);
    }
  }
}
function syncCurrent(touch){
  var conv = currentConv();
  if (!conv) return;
  conv.messages = messages.map(function(m){
    if (m && m.images && m.images.length) return { role: m.role, content: m.content, imgCount: m.images.length };
    return { role: m.role, content: m.content };
  });
  conv.shown = shown;
  conv.sys = $('#sys').value;
  if (!conv.title || conv.title === '新しいチャット') conv.title = deriveTitle(shown);
  if (touch !== false) conv.updatedAt = Date.now();
}
function saveChat(){ syncCurrent(true); saveStore(); renderHistList(); }
function restoreChat(){
  var conv = currentConv();
  var pm = conv && Array.isArray(conv.messages) ? conv.messages : [];
  var ps = conv && Array.isArray(conv.shown) ? conv.shown : [];
  var queue = [];
  ps.forEach(function(s){
    if (s && s.role === 'user' && s.imgs && s.imgs.length){
      queue.push(s.imgs.map(function(i){ return (i && i.dataUrl ? i.dataUrl.split(',')[1] : '') || ''; }).filter(Boolean));
    }
  });
  var qi = 0;
  messages = pm.map(function(m){
    if (!m) return m;
    if (m.images && m.images.length) return m;   // 旧形式（画像を直接保持）
    if (m.imgCount){ var imgs = queue[qi++] || []; return { role: m.role, content: m.content, images: imgs }; }
    return { role: m.role, content: m.content };
  });
  shown = ps;
  $('#sys').value = conv && typeof conv.sys === 'string' ? conv.sys : '';
  $('#log').innerHTML = '';
  shown.forEach(function(m){ appendMsg(m.role === 'user' ? 'user' : (m.role === 'sys' ? 'sys' : 'ai'), m.text || '', m.imgs || []); });
  return shown.length > 0;
}
function renderHistList(){
  var list = $('#histList');
  if (!list) return;
  list.innerHTML = '';
  store.conversations.slice().sort(function(a, b){ return (b.updatedAt || 0) - (a.updatedAt || 0); })
    .forEach(function(c){
      var div = document.createElement('div');
      div.className = 'chat-item' + (c.id === store.currentId ? ' active' : '');
      div.setAttribute('data-id', c.id);
      div.innerHTML = '<span class="t"></span><button class="del" type="button" aria-label="削除">×</button>';
      div.querySelector('.t').textContent = c.title || '新しいチャット';
      list.appendChild(div);
    });
}
function switchChat(id){
  if (chatBusy || id === store.currentId) return;
  syncCurrent(false);
  store.currentId = id;
  saveStore();
  restoreChat();
  renderHistList();
  $('#prompt').focus();
}
function newChat(){
  if (chatBusy) return;
  syncCurrent(false);
  var conv = emptyConv();
  store.conversations.push(conv);
  store.currentId = conv.id;
  saveStore();
  messages = []; shown = []; pending = []; renderPending();
  $('#log').innerHTML = ''; $('#sys').value = '';
  renderHistList();
  note('新しいチャットを開始しました。');
  $('#prompt').focus();
}
function deleteChat(id){
  if (chatBusy) return;
  var idx = -1;
  for (var i = 0; i < store.conversations.length; i++){
    if (store.conversations[i].id === id){ idx = i; break; }
  }
  if (idx < 0) return;
  if (!confirm('このチャットを削除します。よろしいですか？')) return;
  var wasCurrent = (id === store.currentId);
  store.conversations.splice(idx, 1);
  if (!store.conversations.length) store.conversations.push(emptyConv());
  if (wasCurrent){ store.currentId = store.conversations[0].id; saveStore(); restoreChat(); }
  else saveStore();
  renderHistList();
}
function clearAllChats(){
  if (chatBusy) return;
  if (!confirm('保存されているチャット履歴をすべて消去します。よろしいですか？')) return;
  var conv = emptyConv();
  store.conversations = [conv];
  store.currentId = conv.id;
  saveStore();
  messages = []; shown = []; pending = []; renderPending();
  $('#log').innerHTML = ''; $('#sys').value = '';
  renderHistList();
  note('履歴を消去しました。');
}
$('#histList').addEventListener('click', function(e){
  var item = e.target.closest('.chat-item');
  if (!item) return;
  var id = item.getAttribute('data-id');
  if (e.target.closest('.del')){ deleteChat(id); return; }
  switchChat(id);
});
$('#sys').addEventListener('input', saveChat);

/* ---------- 起動 ---------- */
loadStore();
function boot(){
  if (!token){ showGate(''); return; }
  api('/me').then(function(){ showApp(); }).catch(function(err){
    if (err.status === 401){ showGate('ログインが必要です。'); return; }
    showGate(err.message);
  });
}
boot();
})();
</script>
</body>
</html>
