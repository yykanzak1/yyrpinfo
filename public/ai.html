<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){try{var t=localStorage.getItem('dassai_theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0088ff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%2300d2ff'/%3E%3Cstop offset='1' stop-color='%230088ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='%230f1115'/%3E%3Cpath d='M15 16h18c12 0 20 7 20 16s-8 16-20 16H15zm10 9v14h7c6 0 10-3 10-7s-4-7-10-7z' fill='url(%23g)'/%3E%3C/svg%3E">
<title>獺祭 AI コンソール ｜Blue Gang</title>
<style>
:root{
  --bg-color:#0f1115; --card-bg:#181b20; --header-bg:#13151b; --code-bg:#06080a;
  --accent-blue:#0088ff; --accent-cyan:#00d2ff;
  --border-color:#2a2e37; --text-color:#e1e6ed; --text-dim:#8a94a6;
  --highlight-bg:rgba(0,136,255,.15); --cost-color:#ffaa00; --danger:#ff6b6b; --ok:#3ecf8e;
  --mono:"Cascadia Code",Consolas,Menlo,"Noto Sans Mono CJK JP",monospace;
}
html[data-theme="light"]{
  --bg-color:#f2f4f8; --card-bg:#ffffff; --header-bg:#ffffff; --code-bg:#e8ecf3;
  --accent-cyan:#006fa8; --border-color:#d5dae3; --text-color:#1c2330; --text-dim:#5b6577;
  --highlight-bg:rgba(0,136,255,.12); --cost-color:#b36b00; --danger:#c62828; --ok:#1e9e5a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg-color);color:var(--text-color);font-family:'Segoe UI',Roboto,'Helvetica Neue','Hiragino Sans','Noto Sans JP',Arial,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
svg.lucide{width:1em;height:1em;vertical-align:-0.14em;stroke-width:2}
.tbtn svg.lucide,.ibtn svg.lucide{width:17px;height:17px}
.newchat svg.lucide{width:16px;height:16px;color:var(--accent-cyan)}
.newchat:hover svg.lucide{color:#fff}
.send svg.lucide{width:18px;height:18px;stroke-width:2.4}
.stop svg.lucide{width:13px;height:13px;fill:currentColor}
.sitem .x svg.lucide{width:14px;height:14px}
.tool>summary svg.lucide{width:15px;height:15px}
.settings summary svg.lucide{width:14px;height:14px}
.model-chip svg.lucide{width:14px;height:14px;color:var(--accent-cyan)}
.search{margin:0 12px 8px;width:calc(100% - 24px);padding:7px 10px;font-size:.82rem}
.model-detail{margin:8px 0 4px}
.md-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:.68rem;padding:1px 7px;border-radius:999px;border:1px solid var(--border-color);color:var(--text-dim)}
.badge.free{color:var(--ok);border-color:rgba(62,207,142,.5)}
.badge.paid{color:var(--cost-color);border-color:rgba(255,170,0,.45)}
.badge.info{color:var(--accent-cyan);border-color:rgba(0,210,255,.45)}
.badge.t-flagship{color:var(--danger);border-color:rgba(255,107,107,.55);font-weight:700}
.badge.t-high{color:var(--cost-color);border-color:rgba(255,170,0,.55);font-weight:700}
.badge.t-general{color:var(--accent-blue);border-color:rgba(0,136,255,.55);font-weight:700}
.badge.t-fast{color:var(--ok);border-color:rgba(62,207,142,.55);font-weight:700}
.md-desc{font-size:.76rem;color:var(--text-dim);line-height:1.5}
.md-id{font-size:.68rem;color:var(--text-dim);font-family:var(--mono);margin-top:3px;word-break:break-all}
.md-none{font-size:.74rem;color:var(--text-dim)}
.quota-panel{margin:8px 0;padding:9px 10px;border:1px solid var(--border-color);border-radius:8px;background:var(--code-bg);font-size:.75rem;color:var(--text-dim);line-height:1.55}
.quota-panel b{color:var(--text-color)}
.quota-panel .quota-warn{color:var(--cost-color)}
.quota-panel .quota-out{color:var(--danger);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:.82rem;color:var(--text-dim);cursor:pointer}
.chk input{width:auto;margin:0}
.msg-actions{display:flex;gap:6px;margin-top:7px;opacity:.35;transition:opacity .15s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{background:transparent;border:1px solid var(--border-color);color:var(--text-dim);border-radius:6px;padding:2px 8px;font-size:.72rem;display:inline-flex;align-items:center;gap:4px}
.msg-actions button:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.msg-actions svg.lucide{width:12px;height:12px}
.msg-meta{margin-top:5px;font-size:.7rem;color:var(--text-dim);font-family:var(--mono)}
.msg-meta.live{color:var(--accent-cyan)}
.edit-area{width:100%;min-height:70px;font:inherit;background:var(--code-bg);color:var(--text-color);border:1px solid var(--accent-blue);border-radius:8px;padding:8px 10px}
.edit-bar{display:flex;gap:8px;margin-top:8px}
.sitem .pencil{border:0;background:transparent;color:var(--text-dim);padding:2px;border-radius:6px;display:none;align-items:center}
.sitem:hover .pencil{display:inline-flex}
.sitem .pencil:hover{color:var(--accent-cyan)}
.sitem .pencil svg.lucide{width:13px;height:13px}
.sitem [contenteditable="true"]{outline:1px solid var(--accent-blue);border-radius:4px;padding:2px 4px}
input,textarea,select{font:inherit;color:var(--text-color);background:var(--code-bg);border:1px solid var(--border-color);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent-blue);box-shadow:0 0 0 2px var(--highlight-bg)}
.btn{background:var(--accent-blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--border-color);color:var(--text-color);font-weight:600}
.btn.ghost:not(:disabled):hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.danger:not(:disabled):hover{background:rgba(255,107,107,.12)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.mark{width:34px;height:34px;border-radius:9px;flex:none;background:linear-gradient(135deg,#0a2d4d,#0090ff);border:1px solid var(--accent-cyan);display:grid;place-items:center;font-weight:900;color:#fff}

/* ----- gate (login) ----- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 25%,#0a2338 0%,var(--bg-color) 65%)}
html[data-theme="light"] #gate{background:radial-gradient(circle at 50% 25%,#e3f0fb 0%,var(--bg-color) 65%)}
.gcard{width:min(400px,100%);background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:30px;box-shadow:0 0 42px rgba(0,136,255,.14)}
.gbrand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.gbrand h1{font-size:1.2rem;margin:0;color:#fff;letter-spacing:.05em}
html[data-theme="light"] .gbrand h1{color:#0f1723}
.gbrand small{display:block;color:var(--accent-cyan);font-size:.66rem;letter-spacing:.1em;font-family:var(--mono)}
.gcard label{display:block;font-size:.8rem;color:var(--text-dim);margin:14px 0 6px}
.gcard .btn{width:100%;margin-top:20px;padding:11px}
.err{color:var(--danger);font-size:.82rem;min-height:1.2em;margin-top:10px;word-break:break-all}
.gnote{font-size:.72rem;color:var(--text-dim);margin-top:16px;line-height:1.65}

/* ----- app ----- */
#app{height:100vh;display:grid;grid-template-columns:272px 1fr}
aside{background:var(--header-bg);border-right:1px solid var(--border-color);min-height:0;display:flex;flex-direction:column}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 8px}
.sb-brand{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800;color:#fff;letter-spacing:.04em}
html[data-theme="light"] .sb-brand{color:#0f1723}
.sb-brand .mark{width:28px;height:28px;border-radius:7px;font-size:.85rem}
.tbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border-color);background:var(--highlight-bg);color:var(--text-color);font-size:.95rem;padding:0;line-height:1}
.tbtn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
.newchat{display:flex;align-items:center;gap:8px;margin:6px 12px 12px;padding:10px 12px;border-radius:20px;border:1px solid var(--accent-blue);background:var(--highlight-bg);color:var(--text-color);font-weight:700;font-size:.88rem}
.newchat:hover{background:var(--accent-blue);color:#fff}
.slist{flex:1;min-height:0;overflow:auto;padding:2px 8px 8px}
.sgroup{font-size:.68rem;color:var(--accent-cyan);font-weight:700;letter-spacing:.06em;padding:14px 10px 5px;font-family:var(--mono)}
.sgroup:first-child{padding-top:4px}
.s-empty{color:var(--text-dim);font-size:.78rem;padding:16px 10px;line-height:1.6;text-align:center}
.sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.86rem;color:var(--text-color);border-left:3px solid transparent}
.sitem:hover{background:var(--highlight-bg)}
.sitem.active{background:var(--highlight-bg);border-left-color:var(--accent-cyan);font-weight:600}
.sitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .x{flex:none;width:20px;height:20px;line-height:18px;border-radius:6px;border:0;background:transparent;color:var(--text-dim);opacity:0;padding:0;font-size:.9rem}
.sitem:hover .x{opacity:1}
.sitem .x:hover{color:var(--danger);background:rgba(255,107,107,.12)}

.sb-bottom{border-top:1px solid var(--border-color);padding:8px 12px 12px}
.settings{font-size:.82rem}
.settings summary{cursor:pointer;color:var(--text-dim);font-size:.76rem;list-style:none;user-select:none;padding:8px 4px;display:flex;align-items:center;gap:7px;font-family:var(--mono)}
.settings summary::-webkit-details-marker{display:none}
.settings summary:hover{color:var(--accent-cyan)}
.settings-body{display:flex;flex-direction:column;gap:4px;padding:4px 2px 2px}
.settings h3{margin:10px 0 0;font-size:.68rem;color:var(--accent-cyan);letter-spacing:.1em;font-weight:700;font-family:var(--mono)}
.settings label{font-size:.74rem;color:var(--text-dim);margin-top:4px;display:block}
.settings textarea{min-height:68px;resize:vertical}
.settings select{padding:8px 10px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:.72rem;padding:4px 10px;border-radius:999px;border:1px solid var(--border-color);color:var(--text-dim);display:inline-block;font-family:var(--mono)}
.pill.on{color:var(--ok);border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.1)}
.pill.off{color:var(--text-dim)}
.pill.wait{color:var(--cost-color);border-color:rgba(255,170,0,.5);background:rgba(255,170,0,.1)}
.pill.err{color:var(--danger);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.1)}
.sb-hint{font-size:.68rem;color:var(--text-dim);line-height:1.55;padding:2px 2px 0}

main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-color)}
.topbar{height:52px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--accent-blue);background:var(--header-bg)}
.authbar{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--cost-color)}
.authbar .btn.sm{padding:4px 12px}
.model-chip{font-size:.82rem;color:var(--text-dim);display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.model-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-cyan);box-shadow:0 0 8px var(--accent-cyan)}
.model-chip b{color:var(--accent-cyan);font-weight:700}
#log{flex:1;overflow:auto;padding:26px 24px 8px}
.msg{max-width:780px;margin:0 auto 22px;display:flex;gap:14px}
.msg.user{justify-content:flex-end}
.msg.user .body{background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:10px 16px;max-width:82%;overflow-wrap:anywhere}
.msg.ai .body{flex:1;min-width:0;overflow-wrap:anywhere}
.msg.sys{justify-content:center}
.msg.sys .body{font-size:.8rem;color:var(--text-dim);text-align:center}
.avatar{width:28px;height:28px;flex:none;border-radius:8px;background:var(--highlight-bg);border:1px solid var(--accent-blue);color:var(--accent-cyan);display:grid;place-items:center;font-size:.95rem;margin-top:2px}
.body p{margin:0 0 10px}
.body p:last-child{margin-bottom:0}
.body p.err{color:var(--danger)}
.body p.warn{color:var(--cost-color)}
.body h1,.body h2,.body h3{margin:16px 0 8px;color:#fff}
html[data-theme="light"] .body h1,html[data-theme="light"] .body h2,html[data-theme="light"] .body h3{color:#0f1723}
.body ul,.body ol{margin:0 0 10px;padding-left:22px}
.body strong{font-weight:700}
.msg.ai .body a{color:var(--accent-cyan)}
code.inline{background:var(--code-bg);border:1px solid var(--border-color);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:.85em;color:var(--accent-cyan)}
.cursor{display:inline-block;width:2px;color:var(--accent-cyan);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.code{margin:12px 0;border:1px solid var(--border-color);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--header-bg);border-bottom:1px solid var(--border-color);font-size:.72rem;color:var(--text-dim);font-family:var(--mono)}
.code pre{margin:0;padding:14px;overflow:auto;color:var(--text-color);font-family:var(--mono);font-size:.82rem;line-height:1.55}
.copy{background:var(--highlight-bg);border:1px solid var(--accent-blue);color:var(--accent-cyan);border-radius:6px;padding:2px 9px;font-size:.7rem}
.copy:hover{background:var(--accent-blue);color:#fff}

.composer{flex:none;padding:8px 24px 18px;background:var(--bg-color)}
.composer-inner{max-width:780px;margin:0 auto;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.28);padding:10px 10px 8px 16px;transition:border-color .15s,box-shadow .15s}
html[data-theme="light"] .composer-inner{box-shadow:0 2px 12px rgba(40,60,90,.08)}
.composer-inner:focus-within{border-color:var(--accent-blue);box-shadow:0 0 0 2px var(--highlight-bg)}
#prompt{border:0;background:transparent;resize:none;min-height:26px;max-height:220px;padding:4px 6px 4px 0;font-size:.95rem;line-height:1.55;box-shadow:none!important}
#prompt:focus{border:0;box-shadow:none}
.composer-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
.composer-tools .l{display:flex;gap:8px;align-items:center;font-size:.72rem;color:var(--text-dim);font-family:var(--mono)}
.composer-tools .quota-inline{font-size:.68rem;line-height:1.3;color:var(--text-dim);font-family:inherit;white-space:nowrap}
.composer-tools .quota-inline strong{color:var(--cost-color);font-weight:700}
.attachments{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 10px}
.attach{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border-color);background:var(--code-bg)}
.attach img{width:100%;height:100%;object-fit:cover;display:block}
.attach .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;line-height:15px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;padding:0;text-align:center}
.attach .rm:hover{background:var(--danger)}
.ibtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-color);background:transparent;color:var(--text-dim);font-size:.95rem;padding:0;line-height:1}
.ibtn:hover{border-color:var(--accent-cyan);color:var(--accent-cyan)}
select optgroup{color:var(--accent-cyan);font-weight:700;background:var(--card-bg)}
select option{color:var(--text-color);background:var(--card-bg)}
.tool{margin:10px 0;border:1px solid var(--border-color);border-radius:8px;background:var(--code-bg);overflow:hidden}
.tool>summary{cursor:pointer;list-style:none;padding:7px 12px;font-size:.8rem;font-family:var(--mono);color:var(--text-dim);display:flex;align-items:center;gap:8px;user-select:none}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary .ico{color:var(--accent-cyan)}
.tool>summary .tname{color:var(--accent-cyan);font-weight:700}
.tool>summary .ttitle{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tool>summary .tstat{margin-left:auto;flex:none;font-size:.7rem;padding:1px 8px;border-radius:999px;border:1px solid var(--border-color)}
.tool[data-status="running"] .tstat{color:var(--cost-color);border-color:rgba(255,170,0,.5)}
.tool[data-status="completed"] .tstat{color:var(--ok);border-color:rgba(62,207,142,.5)}
.tool[data-status="error"] .tstat{color:var(--danger);border-color:rgba(255,107,107,.5)}
.tool .tbody{padding:8px 12px 12px;border-top:1px solid var(--border-color)}
.tool .tlabel{font-size:.68rem;color:var(--accent-cyan);letter-spacing:.08em;font-family:var(--mono);margin:8px 0 3px}
.tool .tlabel:first-child{margin-top:0}
.tool pre{margin:0;padding:8px 10px;overflow:auto;background:var(--header-bg);border:1px solid var(--border-color);border-radius:6px;font-family:var(--mono);font-size:.78rem;line-height:1.5;max-height:340px;white-space:pre-wrap;word-break:break-word}
.seg{margin:0}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent-blue);color:#fff;display:grid;place-items:center;font-size:1.05rem;padding:0}
.send:not(:disabled):hover{filter:brightness(1.15)}
.send:disabled{background:var(--border-color)}
.stop{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--border-color);background:transparent;color:var(--text-color);font-size:.8rem;font-weight:700}
.stop:not(:disabled):hover{border-color:var(--danger);color:var(--danger)}

/* ----- アイコン付きワークスペース ----- */
.side-nav{display:flex;gap:5px;margin:0 12px 12px;padding:4px;border:1px solid var(--border-color);border-radius:11px;background:var(--code-bg)}
.side-nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;padding:8px 6px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-size:.78rem;font-weight:650;transition:background .16s,color .16s,border-color .16s}
.side-nav a:hover{background:var(--highlight-bg);color:var(--text-color)}
.side-nav a[aria-current="page"]{color:var(--accent-cyan);background:var(--highlight-bg);box-shadow:inset 0 0 0 1px rgba(0,210,255,.18)}
.side-nav svg.lucide{width:15px;height:15px;flex:none}
.search-wrap{position:relative;margin:0 12px 8px}
.search-wrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-dim);pointer-events:none}
.search-wrap .search{display:block;width:100%;margin:0;padding-left:34px}
.topbar{height:60px;padding:0 18px;justify-content:space-between;gap:14px;border-bottom-width:1px;box-shadow:0 4px 22px rgba(0,136,255,.06)}
.topbar-brand{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(0,210,255,.35);border-radius:10px;background:linear-gradient(145deg,rgba(0,210,255,.18),rgba(0,136,255,.08));color:var(--accent-cyan)}
.topbar-icon svg.lucide{width:18px;height:18px}
.topbar-copy{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.topbar-copy small{font:600 .58rem/1.4 var(--mono);letter-spacing:.12em;color:var(--accent-cyan)}
.topbar-copy strong{font-size:.86rem;letter-spacing:.02em}
.topbar-status{display:flex;align-items:center;gap:7px;min-width:0}
.topbar-status .status-pip{width:7px;height:7px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 9px rgba(62,207,142,.6)}

<section id="app" hidden>
  <aside>

      <div class="sb-brand"><span class="mark">獺</span>獺祭 AI</div>
      <button class="tbtn" id="btnTheme" type="button" title="テーマ切替" aria-label="テーマ切替"><i data-lucide="sun-moon"></i></button>

    <nav class="side-nav" aria-label="ページ">

<script>
(function(){
'use strict';
var HELPER = 'http://127.0.0.1:8765';
var TOKEN_KEY = 'dassai_ai_token';
var $ = function(s){ return document.querySelector(s); };

var token = '';
try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }
function persistToken(t){
  token = t || '';
  try { if (token) localStorage.setItem(TOKEN_KEY, token); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  try { if (token) sessionStorage.setItem(TOKEN_KEY, token); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
}
var SESS_KEY = 'dassai_sessions_v1';
var CUR_KEY = 'dassai_current_v1';
var sessions = [];      // [{id,title,ts,shown:[{role,text}],sys}]
var current = null;     // 現在開いているセッション
var chatBusy = false;   // 生成中
var busyNoticeAt = 0;   // 生成中にEnterを連打したときの案内を抑制
var opBusy = false;     // 起動・終了中
var ctrl = null;        // 中断用 AbortController
var pending = [];       // 添付予定の画像 [{mime,url,name}]
var visionSet = {};     // 画像対応モデル id -> true
var modelInfo = {};     // モデル id -> {name, free, reasoning, vision, context, ...}
var quotaState = {};    // APIの実残量ではなく、このブラウザーでの成功回数と枠切れ検出
var pollTimer = null;
var running = false;

function refreshIcons(){ if (window.lucide && window.lucide.createIcons){ try { window.lucide.createIcons(); } catch (e) {} } }
function icon(name){ return '<i data-lucide="' + name + '"></i>'; }

/* ---------- 表示ユーティリティ ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function inline(t){
  return esc(t).replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<h3>$1</h3>')
    .split(/\n{2,}/).map(function(p){ return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
}
function codeBlock(lang, code){
  return '<div class="code"><div class="code-head"><span>' + esc(lang || 'text') +
    '</span><button class="copy" type="button">コピー</button></div><pre><code>' +
    esc(code.replace(/\n$/, '')) + '</code></pre></div>';
}
function render(md){
  var parts = String(md).split(/```([\w+-]*)\n?([\s\S]*?)```/g), html = '';
  for (var i = 0; i < parts.length; i++){
    var m = i % 3;
    if (m === 0){ if (parts[i]) html += inline(parts[i]); }
    else if (m === 1){ html += codeBlock(parts[i], parts[i+1] || ''); i++; }
  }
  return html;
}
function tLabel(txt){ var e = document.createElement('div'); e.className = 'tlabel'; e.textContent = txt; return e; }
function tPre(txt, cls){ var p = document.createElement('pre'); if (cls) p.className = cls; p.textContent = txt; return p; }
function buildToolEl(t){
  var d = document.createElement('details');
  d.className = 'tool';
  d.setAttribute('data-status', t.status || '');
  var s = document.createElement('summary');
  s.innerHTML = '<span class="ico">' + icon('wrench') + '</span>' +
    '<span class="tname"></span><span class="ttitle"></span><span class="tstat"></span>';
  d.appendChild(s);
  d._body = document.createElement('div');
  d._body.className = 'tbody';
  d.appendChild(d._body);
  return d;
}
function updateToolEl(d, t){
  d.setAttribute('data-status', t.status || '');
  d.querySelector('.tname').textContent = t.name || 'tool';
  d.querySelector('.ttitle').textContent = t.title || '';
  d.querySelector('.tstat').textContent = t.status || '';
  var body = d._body;
  body.innerHTML = '';
  var input = t.input;
  if (input && typeof input === 'object' && Object.keys(input).length){
    body.appendChild(tLabel('INPUT'));
    body.appendChild(tPre(JSON.stringify(input, null, 2)));
  }
  if (t.error){
    body.appendChild(tLabel('ERROR'));
    body.appendChild(tPre(String(t.error), 'err'));
  } else if (typeof t.output === 'string' && t.output.length){
    body.appendChild(tLabel('OUTPUT'));
    body.appendChild(tPre(t.output));
  }
  if (!body.childNodes.length){ body.appendChild(tPre('（詳細なし）')); }
  refreshIcons();
}
function scrollLog(){ var l = $('#log'); l.scrollTop = l.scrollHeight; }
function appendMsg(role, text){
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  var body = document.createElement('div');
  body.className = 'body';
  if (role === 'ai'){
    var av = document.createElement('div'); av.className = 'avatar'; av.textContent = '獺';
    wrap.appendChild(av); wrap.appendChild(body);
    body.innerHTML = text ? render(text) : '';
  } else if (role === 'user'){
    wrap.appendChild(body);
    body.innerHTML = inline(text);
  } else {
    wrap.appendChild(body);
    body.innerHTML = render(text);
  }
  $('#log').appendChild(wrap);
  scrollLog();
  return wrap;
}
function note(text, isErr){
  var wrap = appendMsg('sys', text);
  if (isErr){ var b = wrap.querySelector('.body'); b.innerHTML = '<p class="err">' + esc(text) + '</p>'; }
}
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function iconBtn(act, lucide, label, cls){
  var b = el('button'); b.type = 'button'; if (cls) b.className = cls; b.setAttribute('data-act', act);
  b.innerHTML = icon(lucide);
  if (label) b.appendChild(document.createTextNode(' ' + label));
  return b;
}
function msgText(m){ return (m && m.text) ? m.text : ''; }
function addMsgActions(wrap, role, idx){
  wrap.setAttribute('data-idx', String(idx));
  var bar = el('div', 'msg-actions');
  bar.appendChild(iconBtn('copy', 'copy', 'コピー'));
  if (role === 'user') bar.appendChild(iconBtn('edit', 'pencil', '編集して再送'));
  else bar.appendChild(iconBtn('regen', 'refresh-cw', '再生成'));
  wrap.appendChild(bar);
}
function addMsgMeta(wrap, meta){
  if (!meta) return;
  var parts = [];
  if (meta.secs != null) parts.push(meta.secs.toFixed(1) + '秒');
  if (meta.usage && meta.usage.tokens){
    var tk = meta.usage.tokens;
    parts.push('入力 ' + (tk.input || 0) + ' / 出力 ' + (tk.output || 0) + ' トークン');
  }
  if (meta.usage && typeof meta.usage.cost === 'number') parts.push('$' + meta.usage.cost.toFixed(4));
  if (!parts.length) return;
  wrap.appendChild(el('div', 'msg-meta', parts.join('  ·  ')));
}
$('#log').addEventListener('click', function(e){
  var suggestion = e.target.closest('[data-suggest]');
  if (suggestion){ prompt.value = suggestion.getAttribute('data-suggest') || ''; autoResize(); prompt.focus(); return; }
  var act = e.target.closest('[data-act]');
  if (act){
    var wrap = act.closest('.msg');
    var idx = parseInt(wrap.getAttribute('data-idx'), 10);
    var a = act.getAttribute('data-act');
    if (a === 'copy') copyMsg(idx);
    else if (a === 'edit') editMsg(idx);
    else if (a === 'regen') regenerateMsg(idx);
    return;
  }
  var b = e.target.closest('.copy');
  if (!b || !navigator.clipboard) return;
  var code = b.closest('.code').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function(){
    b.textContent = 'コピー済'; setTimeout(function(){ b.textContent = 'コピー'; }, 1200);
  }).catch(function(){});
});
function copyMsg(idx){
  if (!current || !current.shown[idx]) return;
  if (navigator.clipboard) navigator.clipboard.writeText(msgText(current.shown[idx])).catch(function(){});
}
function regenerateMsg(idx){
  if (chatBusy || !current) return;
  var shown = current.shown, ui = idx - 1;
  while (ui >= 0 && shown[ui].role !== 'user') ui--;
  if (ui < 0){ note('再生成できるユーザー発言が見つかりません。', true); return; }
  runChat({ text: shown[ui].text, images: [], reset: true, keep: shown.slice(0, ui) });
}
function editMsg(idx){
  if (chatBusy || !current) return;
  var m = current.shown[idx];
  if (!m || m.role !== 'user') return;
  var wrap = document.querySelector('#log .msg[data-idx="' + idx + '"]');
  if (!wrap) return;
  var body = wrap.querySelector('.body');
  var ta = el('textarea', 'edit-area'); ta.value = m.text || '';
  body.innerHTML = ''; body.appendChild(ta);
  var bar = el('div', 'edit-bar');
  var okb = el('button', 'btn sm', '送信'); okb.type = 'button';
  var cab = el('button', 'btn sm ghost', 'キャンセル'); cab.type = 'button';
  bar.appendChild(okb); bar.appendChild(cab); body.appendChild(bar);
  ta.focus(); try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
  cab.addEventListener('click', function(){ renderLog(); });
  okb.addEventListener('click', function(){
    var t = ta.value.trim(); if (!t) return;
    runChat({ text: t, images: [], reset: true, keep: current.shown.slice(0, idx) });
  });
}
function buildTranscript(keep, promptText){
  if (!keep || !keep.length) return promptText;
  var lines = keep.map(function(m){ return (m.role === 'user' ? 'ユーザー' : 'アシスタント') + ': ' + (m.text || ''); });
  return '＜これまでの会話＞\n' + lines.join('\n') + '\n＜/これまでの会話＞\n\n' + promptText;
}
var _baseTitle = document.title, _titleTimer = null;
function beep(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var c = new AC(), o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime;
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + 0.2);
    setTimeout(function(){ try { c.close(); } catch (e) {} }, 500);
  } catch (e) {}
}
function stopTitleBlink(){ if (_titleTimer){ clearInterval(_titleTimer); _titleTimer = null; document.title = _baseTitle; } }
function notifyDone(ok){
  if (!ok) return;
  var on = true;
  try { on = localStorage.getItem('dassai_notify') !== '0'; } catch (e) {}
  if (!on || !document.hidden) return;
  beep();
  if (!_titleTimer){
    var phase = false;
    _titleTimer = setInterval(function(){ phase = !phase; document.title = phase ? '● 応答完了' : _baseTitle; }, 900);
  }
}
window.addEventListener('focus', stopTitleBlink);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) stopTitleBlink(); });

/* ---------- ヘルパー通信 ---------- */
function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var init = Object.assign({}, opts, { headers: headers, cache: 'no-store' });
  return fetch(HELPER + path, init).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(j){
      if (res.status === 401 && path !== '/login'){
        expireSession('セッションの期限が切れました。再度ログインしてください。');
      }
      if (!res.ok){
        var err = new Error(j.message || ('HTTP ' + res.status));
        err.status = res.status;
        throw err;
      }
      return j;
    });
  }, function(){
    var err = new Error('ヘルパーに接続できません（python server.py が起動しているか確認してください）');
    err.offline = true;
    throw err;
  });
}

/* ---------- ゲート（ログイン） ---------- */
function setAuthBar(show, msg){
  var b = $('#authbar');
  if (!b) return;
  if (show){ b.hidden = false; $('#authMsg').textContent = msg || 'ログインが必要です'; }
  else { b.hidden = true; }
}
function showGate(msg){
  stopPolling();
  $('#app').hidden = false;   /* 保存済みの履歴は表示したまま、上にログインを重ねる */
  $('#gate').hidden = false;
  $('#gateErr').textContent = msg || '';
  setAuthBar(true, msg || 'ログインが必要です');
  setTimeout(function(){ $('#gid').focus(); }, 0);
}
function afterAuth(){
  $('#gate').hidden = true;
  $('#app').hidden = false;
  setAuthBar(false);
  renderLog();
  renderSessions();
  refreshIcons();
  startPolling();
  loadModels();
  updateModelChip();
  $('#prompt').focus();
}
function expireSession(msg){
  persistToken('');
  showGate(msg);
}

$('#gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  $('#gateErr').textContent = '';
  api('/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id: $('#gid').value.trim(), pw: $('#gpw').value }) })
    .then(function(j){
      persistToken(j.token);
      $('#gpw').value = '';
      afterAuth();
    })
    .catch(function(err){ $('#gateErr').textContent = err.message; });
});

$('#btnLogout').addEventListener('click', function(){
  api('/logout', { method: 'POST' }).catch(function(){}).then(function(){
    expireSession('ログアウトしました。');
  });
});
$('#btnLogin').addEventListener('click', function(){ showGate(''); });

/* ---------- opencode 起動・終了・状態 ---------- */
function setPill(cls, text){
  var p = $('#pill'); p.className = 'pill ' + cls; p.textContent = text;
  var dot = p.parentNode && p.parentNode.querySelector('.status-pip');
  if (dot) dot.className = 'status-pip ' + cls;
}
function setCtlButtons(){
  var busy = opBusy;
  $('#btnStart').disabled = busy || running;
  $('#btnStop').disabled = busy || !running;
  $('#btnRefresh').disabled = busy;
}
function refreshStatus(){
  if (opBusy) return Promise.resolve();
  return api('/status').then(function(j){
    running = !!j.running;
    if (j.directory && !$('#dir').value) $('#dir').value = j.directory;
    setPill(running ? 'on' : 'off', running ? 'opencode 稼働中' + (j.managed ? '（ヘルパー起動）' : '') : 'opencode 停止中');
    setCtlButtons();
  }).catch(function(err){
    running = false;
    setPill('err', err.offline ? 'ヘルパー未接続' : err.message);
    setCtlButtons();
  });
}
function controlServer(path, label, body){
  if (opBusy) return;
  opBusy = true;
  setPill('wait', label);
  setCtlButtons();
  api(path, { method: 'POST', headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined })
    .then(function(j){ note(j.message || '完了'); })
    .catch(function(err){ note('エラー: ' + err.message, true); })
    .then(function(){
      opBusy = false;
      setCtlButtons();
      return refreshStatus();
    })
    .then(function(){ loadModels(); });
}
$('#btnStart').addEventListener('click', function(){
  controlServer('/start', '起動中…', { directory: $('#dir').value.trim() });
});
$('#btnStop').addEventListener('click', function(){
  if (chatBusy && ctrl) ctrl.abort();
  controlServer('/stop', '終了中…');
});
$('#btnRefresh').addEventListener('click', function(){ refreshStatus(); loadModels(); });

function startPolling(){ stopPolling(); refreshStatus(); pollTimer = setInterval(refreshStatus, 5000); }
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* ---------- モデル一覧（無料のみ表示） ---------- */
function isFreeModel(m){
  var s = String(m).toLowerCase();
  var mi = modelInfo[m] || {};
  // Never infer that a model is free from its name alone: only zero-priced catalog entries,
  // explicitly free variants, and local inference are eligible for automatic fallback.
  if (mi.free === true) return true;
  if (/:free(?:$|\/)/i.test(s)) return true;
  return /^(ollama|lmstudio|lm-studio|local)\//i.test(s);
}
function fmtCtx(n){
  if (!n) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 ? 1 : 0) + 'M';
  if (n >= 1000) return Math.round(n / 1000) + 'K';
  return String(n);
}
function modelTier(id, mi){
  var name = (mi && mi.name) ? mi.name : id;
  var s = (name + ' ' + id + ' ' + ((mi && mi.family) || '')).toLowerCase();
  var fastHint = /flash|mini|lite|haiku|nano|small|tiny|\bfast\b/.test(s);
  var score = 0;
  if (/opus|o3|o4|gpt-6|gpt-7|grok-4|\bmax\b|ultra/.test(s)) score += 3;
  if (/sonnet|\bpro\b|think|reason/.test(s)) score += 2;
  if (mi && mi.reasoning) score += 1;
  if (mi && mi.context && mi.context >= 200000) score += 1;
  if (score >= 4) return { key: 'flagship', label: '最難関', rank: 4, desc: '最難関クラス。複雑な推論や難しい課題に最も適しています。' };
  if (score >= 2 && !fastHint) return { key: 'high', label: '高精度', rank: 3, desc: '高精度。複雑なコーディングや多段の推論に強い。' };
  if (fastHint || score <= -1) return { key: 'fast', label: '高速', rank: 1, desc: '高速・軽量。簡単なタスクや短い応答に最も効率的。' };
  return { key: 'general', label: '汎用', rank: 2, desc: '汎用バランス型。日常的なタスク全般に使えます。' };
}
function renderModelDetail(v, mi){
  var box = $('#modelDetail');
  if (!box) return;
  if (!v || !mi){ box.innerHTML = '<span class="md-none">モデルを選ぶと特徴が表示されます。</span>'; return; }
  var t = modelTier(v, mi);
  var b = ['<span class="badge t-' + t.key + '">' + esc(t.label) + '</span>'];
  b.push(mi.free ? '<span class="badge free">無料</span>' : '<span class="badge paid">有料</span>');
  if (mi.reasoning) b.push('<span class="badge info">推論</span>');
  if (mi.vision) b.push('<span class="badge info">画像</span>');
  if (mi.toolcall) b.push('<span class="badge">ツール</span>');
  if (mi.context) b.push('<span class="badge">文脈 ' + esc(fmtCtx(mi.context)) + '</span>');
  box.innerHTML = '<div class="md-badges">' + b.join('') + '</div>' +
    '<div class="md-desc">' + esc(t.desc) + '</div>' +
    '<div class="md-id">' + esc(mi.name || v) + '  ' + esc(v) + '</div>';
  refreshIcons();
}
function loadQuotaState(){
  try { quotaState = JSON.parse(localStorage.getItem('dassai_model_quota_v1') || '{}') || {}; } catch(e) { quotaState = {}; }
  if (!quotaState || typeof quotaState !== 'object') quotaState = {};
}
function saveQuotaState(){ try { localStorage.setItem('dassai_model_quota_v1', JSON.stringify(quotaState)); } catch(e) {} }
function quotaMonth(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function quotaRecord(model, exhausted){
  var q = quotaState[model] || {month:quotaMonth(),success:0,exhausted:false};
  if (q.month !== quotaMonth()) q = {month:quotaMonth(),success:0,exhausted:false};
  if (exhausted){ q.exhausted = true; q.detectedAt = Date.now(); } else { q.success++; q.exhausted = false; q.detectedAt = 0; }
  quotaState[model] = q; saveQuotaState(); renderQuotaPanel(model);
}
function isQuotaBlocked(model){ var q = quotaState[model] || {}; return !!(q.exhausted && Date.now() - (q.detectedAt || 0) < 60*60*1000); }
function renderQuotaPanel(model){
  var box = $('#quotaPanel'); if (!box) return;
  var q = quotaState[model] || {month:quotaMonth(),success:0,exhausted:false};
  if (q.month !== quotaMonth()) q = {month:quotaMonth(),success:0,exhausted:false};
  var inline = $('#quotaInline');
  if (inline){
    var state = isQuotaBlocked(model) ? '上限到達' : '未取得';
    inline.innerHTML = '無料枠あと <strong>' + state + '</strong> <span>· 今月 ' + q.success + '回利用</span>';
    inline.title = isQuotaBlocked(model) ? '利用上限を検出したため別モデルへ切り替えます。1時間後に再確認します。' : 'プロバイダーが残量を公開していないため正確な残り回数は不明です。今月の成功回数を併記しています。';
  }
  box.innerHTML = '<b>この端末での今月の成功回数：</b>' + q.success + '回' +
    (isQuotaBlocked(model) ? '<br><span class="quota-out">枠切れを検出・1時間は自動切替候補から除外中</span>' : '<br><span class="quota-warn">プロバイダーの実際の残量・上限は取得できないため、残り回数は表示できません。</span>') +
    '<br><span>回数はこのブラウザー内の目安です。別端末・別ブラウザーとは共有されません。</span>';
}
function updateModelChip(){
  var c = $('#modelChip');
  var v = $('#model') ? $('#model').value : '';
  var mi = modelInfo[v] || null;
  if (c) c.innerHTML = esc((mi && mi.name) || v || 'モデル未選択') + (visionSet[v] ? ' ' + icon('image') : '');
  renderModelDetail(v, mi);
  renderQuotaPanel(v);
  refreshIcons();
}
function loadModels(){
  var sel = $('#model');
  var keep = sel.value;
  return api('/models').then(function(j){
    sel.innerHTML = '';
    visionSet = {};
    (j.vision || []).forEach(function(v){ visionSet[v] = true; });
    modelInfo = j.info || {};
    if (!j.models.length){
      sel.innerHTML = '<option value="">（モデルなし: opencode の認証を確認）</option>';
      updateModelChip();
      return;
    }
    var list = j.models.filter(isFreeModel);
    if (!list.length){
      sel.innerHTML = '<option value="">（無料と確認できるモデルがありません）</option>';
      updateModelChip();
      note('無料と確認できるモデルがありません。有料モデルには自動で切り替えません。OpenCode に無料プロバイダーを接続してから「モデル一覧を再読み込み」してください。', true);
      return;
    }
    function rankOf(m){ return modelTier(m, modelInfo[m]).rank; }
    function optLabel(m){
      var mi = modelInfo[m] || {};
      var q = quotaState[m] || {};
      if (isQuotaBlocked(m)) return '⛔ 枠切れ検出 — ' + (mi.name || m);
      var t = modelTier(m, mi);
      var flags = [];
      if (mi.free) flags.push('無料');
      if (mi.reasoning) flags.push('推論');
      if (mi.context) flags.push(fmtCtx(mi.context));
      return (mi.name || m) + '  —  ' + t.label + (flags.length ? '・' + flags.join('・') : '');
    }
    function addGroup(label, arr){
      if (!arr.length) return;
      arr = arr.slice().sort(function(a, b){ return rankOf(b) - rankOf(a); });
      var g = document.createElement('optgroup');
      g.label = label;
      arr.forEach(function(m){
        var o = document.createElement('option');
        o.value = m; o.textContent = optLabel(m); o.title = m; g.appendChild(o);
      });
      sel.appendChild(g);
    }
    var vis = list.filter(function(m){ return visionSet[m]; });
    var novis = list.filter(function(m){ return !visionSet[m]; });
    addGroup('画像対応モデル', vis);
    addGroup('画像非対応モデル', novis);
    if (keep && list.indexOf(keep) >= 0) sel.value = keep;
    else if (j.default && list.indexOf(j.default) >= 0) sel.value = j.default;
    updateModelChip();
  }).catch(function(err){
    if (err.status === 401) return;
    sel.innerHTML = '<option value="">（opencode 停止中・起動してください）</option>';
    updateModelChip();
  });
}
$('#btnModels').addEventListener('click', loadModels);
$('#model').addEventListener('change', updateModelChip);

/* ---------- セッション（チャット履歴）管理 ---------- */
function uid(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function titleOf(shown){
  if (!shown || !shown.length) return '';
  for (var i=0;i<shown.length;i++){ if (shown[i].role === 'user' && shown[i].text) return shown[i].text.slice(0, 48); }
  return '';
}
function groupLabel(ts){
  var n = new Date();
  var d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if (ts >= d0) return '今日';
  if (ts >= d0 - 86400000) return '昨日';
  if (ts >= d0 - 6 * 86400000) return '過去7日間';
  var d = new Date(ts);
  if (d.getFullYear() === n.getFullYear()) return 'それ以前';
  return d.getFullYear() + '年';
}
function loadStore(){
  try { sessions = JSON.parse(localStorage.getItem(SESS_KEY) || '[]') || []; } catch (e) { sessions = []; }
  if (!Array.isArray(sessions)) sessions = [];
  var cid = null;
  try { cid = localStorage.getItem(CUR_KEY); } catch (e) { cid = null; }
  current = null;
  for (var i=0;i<sessions.length;i++){ if (sessions[i].id === cid){ current = sessions[i]; break; } }
}
function saveStore(){
  try {
    localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
    if (current) localStorage.setItem(CUR_KEY, current.id);
    else localStorage.removeItem(CUR_KEY);
  } catch (e) {
    note('履歴の保存に失敗しました（容量超過の可能性）。', true);
  }
}
function migrateLegacy(){
  if (sessions.length) return;
  var changed = false;
  var old = null;
  try { old = JSON.parse(localStorage.getItem('dassai_chat_history_v1') || 'null'); } catch (e) { old = null; }
  if (Array.isArray(old)){
    old.forEach(function(h){
      sessions.push({ id: uid(), title: h.name || 'チャット', ts: h.ts || Date.now(), shown: h.shown || [], sys: h.sys || '' });
      changed = true;
    });
  }
  try {
    var cur = JSON.parse(localStorage.getItem('dassai_chat_v1') || 'null');
    if (cur && Array.isArray(cur.shown) && cur.shown.length){
      sessions.push({ id: uid(), title: titleOf(cur.shown) || 'チャット', ts: Date.now(), shown: cur.shown, sys: cur.sys || '' });
      changed = true;
    }
  } catch (e) {}
  if (changed){ current = sessions[sessions.length - 1]; saveStore(); }
}
function renderSessions(){
  var list = $('#slist');
  if (!list) return;
  if (!sessions.length){
    list.innerHTML = '<div class="s-empty">まだチャットがありません。<br>「新しいチャット」から始めましょう。</div>';
    return;
  }
  var q = '';
  try { q = ($('#search') ? ($('#search').value || '') : '').trim().toLowerCase(); } catch (e) { q = ''; }
  var sorted = sessions.slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
  if (q) sorted = sorted.filter(function(s){ return matchSession(s, q); });
  if (!sorted.length){
    list.innerHTML = '<div class="s-empty">「' + esc(q) + '」に一致するチャットがありません。</div>';
    return;
  }
  var html = '', lastGroup = null;
  sorted.forEach(function(s){
    var g = groupLabel(s.ts || Date.now());
    if (g !== lastGroup){ html += '<div class="sgroup">' + esc(g) + '</div>'; lastGroup = g; }
    var active = current && s.id === current.id;
    var title = s.title || titleOf(s.shown) || '新しいチャット';
    html += '<div class="sitem' + (active ? ' active' : '') + '" data-id="' + s.id + '">' +
      '<div class="t">' + esc(title) + '</div>' +
      '<button class="pencil" type="button" data-rename="' + s.id + '" title="名前を変更">' + icon('pencil') + '</button>' +
      '<button class="x" type="button" data-del="' + s.id + '" title="削除">' + icon('x') + '</button>' +
    '</div>';
  });
  list.innerHTML = html;
  refreshIcons();
}
function matchSession(s, q){
  if (s.title && s.title.toLowerCase().indexOf(q) >= 0) return true;
  var shown = s.shown || [];
  for (var i=0;i<shown.length;i++){ if ((shown[i].text || '').toLowerCase().indexOf(q) >= 0) return true; }
  return false;
}
function renderLog(){
  $('#log').innerHTML = '';
  if (current && Array.isArray(current.shown) && current.shown.length){
    current.shown.forEach(function(m, i){
      var wrap = appendMsg(m.role === 'user' ? 'user' : 'ai', m.text || '');
      addMsgMeta(wrap, m.meta);
      addMsgActions(wrap, m.role === 'user' ? 'user' : 'ai', i);
    });
    refreshIcons();
  } else {
    $('#log').innerHTML = '<div class="empty-state"><div class="empty-mark">' + icon('sparkles') + '</div>' +
      '<p class="empty-kicker">DASSAI AI / READY</p><h2>何を一緒に進めますか？</h2>' +
      '<p class="empty-copy">下の入力欄から相談できます。送信に失敗した場合は、入力文を戻して原因を表示します。</p>' +
      '<div class="suggestions">' +
      '<button class="suggestion" type="button" data-suggest="このコードの処理を初心者にもわかるように説明して">' + icon('code-xml') + 'コードを説明</button>' +
      '<button class="suggestion" type="button" data-suggest="この文章を自然で短い日本語に整えて">' + icon('pencil-line') + '文章を整える</button>' +
      '<button class="suggestion" type="button" data-suggest="このエラーの原因と解決手順を教えて">' + icon('search') + 'エラーを調べる</button>' +
      '</div></div>';
    refreshIcons();
  }
}
function openSession(id){
  if (chatBusy) return;
  var s = null;
  for (var i=0;i<sessions.length;i++){ if (sessions[i].id === id){ s = sessions[i]; break; } }
  if (!s) return;
  current = s;
  pending = []; renderAttachments();
  $('#sys').value = s.sys || '';
  renderLog();
  renderSessions();
  saveStore();
  $('#prompt').focus();
}
function deleteSession(id){
  if (chatBusy) return;
  sessions = sessions.filter(function(x){ return x.id !== id; });
  if (current && current.id === id){
    current = null;
    $('#sys').value = '';
    renderLog();
  }
  saveStore();
  renderSessions();
}
function newChat(){
  if (chatBusy) return;
  current = null;
  pending = []; renderAttachments();
  $('#sys').value = '';
  $('#log').innerHTML = '';
  api('/new', { method: 'POST' }).catch(function(){});
  renderSessions();
  saveStore();
  renderLog();
  $('#prompt').focus();
}
$('#btnNew').addEventListener('click', newChat);
$('#slist').addEventListener('click', function(e){
  var ren = e.target.closest('[data-rename]');
  if (ren){
    e.stopPropagation();
    var ri = ren.closest('.sitem');
    renameTitle(ri.querySelector('.t'), ren.getAttribute('data-rename'));
    return;
  }
  var del = e.target.closest('[data-del]');
  if (del){
    e.stopPropagation();
    if (confirm('このチャットを削除しますか？')) deleteSession(del.getAttribute('data-del'));
    return;
  }
  var item = e.target.closest('[data-id]');
  if (item) openSession(item.getAttribute('data-id'));
});
function renameTitle(tEl, id){
  if (!tEl) return;
  var s = null;
  for (var i=0;i<sessions.length;i++){ if (sessions[i].id === id){ s = sessions[i]; break; } }
  if (!s) return;
  tEl.setAttribute('contenteditable', 'true');
  tEl.focus();
  try {
    var r = document.createRange(); r.selectNodeContents(tEl);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  } catch (e) {}
  var done = false;
  function finish(save){
    if (done) return; done = true;
    tEl.setAttribute('contenteditable', 'false');
    if (save){ var v = tEl.textContent.trim(); if (v) s.title = v; }
    saveStore(); renderSessions();
  }
  tEl.addEventListener('blur', function(){ finish(true); });
  tEl.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); finish(true); }
    else if (ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
  });
}
var _searchEl = $('#search');
if (_searchEl) _searchEl.addEventListener('input', renderSessions);
$('#btnClear').addEventListener('click', function(){
  if (chatBusy) return;
  if (!confirm('保存されているすべてのチャット履歴を消去します。よろしいですか？')) return;
  sessions = [];
  current = null;
  $('#sys').value = '';
  $('#log').innerHTML = '';
  api('/new', { method: 'POST' }).catch(function(){});
  saveStore();
  renderSessions();
  note('すべての履歴を消去しました。');
});

var prompt = $('#prompt');

function autoResize(){
  prompt.style.height = 'auto';
  prompt.style.height = Math.min(prompt.scrollHeight, 220) + 'px';
  $('#count').textContent = prompt.value.length + ' 文字';
}
prompt.addEventListener('input', autoResize);
prompt.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

/* ---------- 画像添付 ---------- */
function fileToDataUrl(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = function(){ rej(new Error('画像の読み込みに失敗しました')); };
    r.readAsDataURL(file);
  });
}
function addFiles(files){
  var imgs = Array.prototype.slice.call(files || []).filter(function(f){ return /^image\//.test(f.type); });
  if (!imgs.length) return;
  imgs = imgs.slice(0, Math.max(0, 8 - pending.length));
  Promise.all(imgs.map(function(f){
    return fileToDataUrl(f).then(function(url){ return { mime: f.type, url: url, name: f.name || 'image' }; });
  })).then(function(list){ pending = pending.concat(list); renderAttachments(); })
     .catch(function(err){ note(err.message, true); });
}
function renderAttachments(){
  var box = $('#attachments');
  box.innerHTML = '';
  if (!pending.length){ box.hidden = true; return; }
  box.hidden = false;
  pending.forEach(function(a, i){
    var d = document.createElement('div'); d.className = 'attach';
    var im = document.createElement('img'); im.src = a.url; im.alt = a.name; d.appendChild(im);
    var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.innerHTML = icon('x'); rm.title = '削除';
    rm.addEventListener('click', function(){ pending.splice(i, 1); renderAttachments(); });
    d.appendChild(rm); box.appendChild(d);
  });
  refreshIcons();
}
$('#btnAttach').addEventListener('click', function(){ $('#fileInput').click(); });
$('#fileInput').addEventListener('change', function(){ var f = this.files; this.value = ''; addFiles(f); });
prompt.addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  var fs = [];
  for (var i = 0; i < items.length; i++){ if (items[i].kind === 'file' && /^image\//.test(items[i].type)) fs.push(items[i].getAsFile()); }
  if (fs.length){ e.preventDefault(); addFiles(fs); }
});
(function(){
  var ci = document.querySelector('.composer-inner');
  if (!ci) return;
  ci.addEventListener('dragover', function(e){ e.preventDefault(); ci.style.borderColor = 'var(--accent-cyan)'; });
  ci.addEventListener('dragleave', function(){ ci.style.borderColor = ''; });
  ci.addEventListener('drop', function(e){
    e.preventDefault(); ci.style.borderColor = '';
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
})();

/* ---------- 送信・ストリーミング ---------- */
function setChatUi(){
  $('#btnSend').disabled = chatBusy;
  $('#btnStopChat').disabled = !chatBusy;
}
function send(){
  if (chatBusy){
    if ((prompt.value.trim() || pending.length) && Date.now() - busyNoticeAt > 3000){
      busyNoticeAt = Date.now();
      note('応答中です。入力内容は送信完了まで入力欄に残ります。');
    }
    return;
  }
  var text = prompt.value.trim();
  var sendImages = pending.slice();
  if (!text && !sendImages.length) return;
  var model = $('#model').value;
  if (!model){
    note('モデルが選択されていません。opencode を起動し、モデルを選んでください。', true);
    return;
  }
  if (sendImages.length && !visionSet[model]){
    note('選択中のモデルは画像に未対応の可能性があります（画像対応モデルを推奨）。', true);
  }
  if (!text) text = 'この画像について説明してください';
  prompt.value = ''; autoResize();
  pending = []; renderAttachments();
  runChat({ text: text, images: sendImages, reset: false });
}

function runChat(opts){
  if (chatBusy) return;
  var text = opts.text || '';
  var images = opts.images || [];
  var model = $('#model').value;
  if (!model){ note('モデルが選択されていません。opencode を起動し、モデルを選んでください。', true); return; }

  if (!current){
    current = { id: uid(), title: '', ts: Date.now(), shown: [], sys: $('#sys').value };
    sessions.push(current);
  }
  if (opts.keep) current.shown = opts.keep.slice();
  current.sys = $('#sys').value;

  var displayText = text + (images.length ? '\n\n（画像' + images.length + '枚を添付）' : '');
  var userShown = { role: 'user', text: displayText };
  current.shown.push(userShown);
  if (!current.title) current.title = text.slice(0, 48);
  current.ts = Date.now();
  saveStore();
  renderLog();
  renderSessions();
  if (opts.notice) note(opts.notice);

  var aiWrap = appendMsg('ai', '');
  var aiBody = aiWrap.querySelector('.body');
  var live = el('div', 'msg-meta live');
  aiWrap.appendChild(live);

  var sysText = $('#sys').value.trim();
  var session = current;
  var sendText = opts.reset ? buildTranscript(opts.keep, text) : text;
  var started = Date.now();
  var tick = setInterval(function(){ live.textContent = ((Date.now() - started) / 1000).toFixed(1) + '秒'; }, 250);
  var usage = null;
  var quotaFallback = null;
  var failureNotice = opts.notice || '';
  var failureNoticeIsError = false;

  chatBusy = true; setChatUi();
  ctrl = new AbortController();
  var acc = '', ok = false, hasContent = false;
  var segText = '', segEl = null, toolEls = {};
  var curEl = document.createElement('span');
  curEl.className = 'cursor'; curEl.textContent = '▍';
  aiBody.appendChild(curEl);
  function placeCursor(){ aiBody.appendChild(curEl); }
  function ensureSeg(){
    if (!segEl){ segEl = document.createElement('div'); segEl.className = 'seg'; aiBody.appendChild(segEl); }
    return segEl;
  }
  function handleTool(t){
    var e2 = toolEls[t.id];
    if (!e2){ e2 = buildToolEl(t); toolEls[t.id] = e2; aiBody.appendChild(e2); segEl = null; segText = ''; }
    updateToolEl(e2, t);
    hasContent = true;
  }

  fetch(HELPER + '/chat', {
    method: 'POST',
    signal: ctrl.signal,
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ model: model, text: sendText, system: sysText, reset: !!opts.reset,
      images: images.map(function(a){ return { mime: a.mime, url: a.url, filename: a.name }; }) })
  }).then(function(res){
    if (!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        if (res.status === 401){ expireSession('セッションの期限が切れました。再度ログインしてください。'); throw new Error('ログインが必要です'); }
        throw new Error(j.message || ('HTTP ' + res.status));
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder('utf-8');
    var buf = '';

    function handleLine(line){
      if (!line.trim()) return;
      var obj = JSON.parse(line);
      if (obj.error) throw new Error(obj.error);
      if (obj.usage) usage = obj.usage;
      if (obj.tool){ handleTool(obj.tool); }
      else if (obj.message && obj.message.content){
        segText += obj.message.content;
        acc += obj.message.content;
        ensureSeg().innerHTML = render(segText);
        hasContent = true;
      }
      placeCursor();
    }
    function pump(){
      return reader.read().then(function(r){
        if (r.done){
          if (buf.trim()) handleLine(buf);
          return;
        }
        buf += dec.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) >= 0){
          var line = buf.slice(0, idx); buf = buf.slice(idx + 1);
          handleLine(line);
        }
        scrollLog();
        return pump();
      });
    }
    return pump().then(function(){
      if (curEl.parentNode) curEl.parentNode.removeChild(curEl);
      if (!hasContent) throw new Error('モデルから応答内容が届きませんでした。入力文を戻しました。設定・サーバーで opencode_serve.log を確認してください。');
      ok = true;
    });
  }).catch(function(err){
    if (curEl.parentNode) curEl.parentNode.removeChild(curEl);
    if (err && err.name === 'AbortError'){
      if (segEl) segEl.innerHTML = render(segText);
      failureNotice = '生成を中断しました。';
      ok = hasContent;
    } else if (err instanceof TypeError){
      failureNotice = 'ヘルパーに接続できません（server.py を確認してください）。入力文を戻しました。';
      failureNoticeIsError = true;
    } else {
      var errText = err.message || String(err);
      // OpenCode/provider error names are often camelCase or snake_case (e.g. FreeUsageLimitError).
      var quotaErr = /quota|free.{0,24}(usage|tier|request|limit)|usage.{0,16}(limit|exceeded)|rate.?limit|too many requests|insufficient.*(credit|fund)|out of (credits|requests)|exhausted|無料枠|利用上限|残高不足|429|402/i.test(errText);
      if (quotaErr && !hasContent){
        quotaRecord(model, true);
        var candidates = Array.prototype.slice.call($('#model').options).map(function(o){return o.value;}).filter(function(m){return m && m !== model && isFreeModel(m) && !isQuotaBlocked(m) && (!images.length || visionSet[m]);});
        if (candidates.length){
          quotaFallback = candidates[0]; $('#model').value = quotaFallback; updateModelChip();
          failureNotice = (modelInfo[model] && modelInfo[model].name || model) + ' の利用上限を検出したため、' + (modelInfo[quotaFallback] && modelInfo[quotaFallback].name || quotaFallback) + ' に切り替えて再試行します。';
        }
        else { quotaFallback = ''; }
      }
      if (!quotaFallback){
        failureNotice = (quotaErr ? 'このプロバイダーで利用可能な無料モデルがありません。有料モデルへは切り替えません。別の無料プロバイダーをOpenCodeに接続してください。\n' : 'エラー: ') + errText;
        failureNoticeIsError = true;
        if (hasContent) ok = true;
      }
    }
  }).then(function(){
    clearInterval(tick);
    if (ok){
      quotaRecord(model, false);
      session.shown.push({ role: 'ai', text: acc, meta: { secs: (Date.now() - started) / 1000, usage: usage } });
    } else {
      var j = session.shown.lastIndexOf(userShown); if (j >= 0) session.shown.splice(j, 1);
      if (!session.shown.length){
        sessions = sessions.filter(function(x){ return x.id !== session.id; });
        if (current && current.id === session.id) current = null;
      }
      if (!quotaFallback && !prompt.value.trim() && !pending.length){
        prompt.value = text;
        pending = images.slice();
        renderAttachments();
        autoResize();
      }
    }
    session.ts = Date.now();
    saveStore();
    renderLog();
    renderSessions();
    if (failureNotice && !quotaFallback) note(failureNotice, failureNoticeIsError);
    chatBusy = false; ctrl = null;
    setChatUi();
    if (quotaFallback){ var ri = session.shown.lastIndexOf(userShown); if (ri >= 0) session.shown.splice(ri,1); if (!session.shown.length){ sessions = sessions.filter(function(x){return x.id !== session.id;}); if (current && current.id === session.id) current = null; } saveStore(); renderSessions(); runChat(Object.assign({}, opts, {notice: failureNotice})); return; }
    scrollLog();
    notifyDone(ok);
    prompt.focus();
  });
}
$('#btnSend').addEventListener('click', send);
$('#btnStopChat').addEventListener('click', function(){ if (ctrl) ctrl.abort(); });
$('#sys').addEventListener('input', function(){
  if (current){ current.sys = $('#sys').value; saveStore(); }
});

/* ---------- 完了通知の設定 ---------- */
var notifyEl = $('#optNotify');
if (notifyEl){
  try { notifyEl.checked = localStorage.getItem('dassai_notify') !== '0'; } catch (e) { notifyEl.checked = true; }
  notifyEl.addEventListener('change', function(){
    try { localStorage.setItem('dassai_notify', notifyEl.checked ? '1' : '0'); } catch (e) {}
  });
}

/* ---------- キーボードショートカット ---------- */
document.addEventListener('keydown', function(e){
  var mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  var k = e.key.toLowerCase();
  if (k === 'k'){
    e.preventDefault();
    var d = $('.settings'); if (d) d.open = true;
    var m = $('#model'); if (m) m.focus();
  } else if (k === 'n'){
    e.preventDefault();
    newChat();
  } else if (k === 'f'){
    e.preventDefault();
    var s = $('#search'); if (s){ s.focus(); if (s.select) s.select(); }
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && chatBusy && ctrl) ctrl.abort();
});

/* ---------- 起動 ---------- */
function boot(){
  loadQuotaState();
  loadStore();
  migrateLegacy();
  /* まず保存済みの履歴を描画して表示する（ログインの有無に関わらず消さない） */
  $('#gate').hidden = true;
  $('#app').hidden = false;
  renderLog();
  renderSessions();
  refreshIcons();
  if (!token){
    setAuthBar(true, '未ログイン（履歴はこの端末に保存されています）');
    if (!sessions.length) showGate('');   /* 履歴が無い初回だけログイン画面を表示 */
    return;
  }
  api('/me').then(function(){
    afterAuth();
  }).catch(function(err){
    if (err.status === 401){
      setAuthBar(true, 'ログインの有効期限が切れました。再ログインしてください');
      return;                              /* 履歴は表示したまま */
    }
    setAuthBar(true, 'ヘルパー未接続（履歴はこの端末に保存されています）');
  });
}
boot();
})();
</script>
